    <title>ステップワイズ 管理</title>
    <style>
      :root {
        --ink: #19212a; --muted: #64717f; --line: #dbe3ea; --paper: #fbfcfd; --soft: #eef4fb;
        --primary: #0717a8; --primary-dark: #07106f; --coral: #d86f8d; --coral-soft: #fbeef2;
        --amber: #a86f12; --amber-soft: #fdf3e3; --green: #2e8b57; --green-soft: #e6f4ec;
        --danger: #c0392b; --danger-soft: #fbe9e7; --taken: #eef1f4; --white: #fff;
        --shadow: 0 10px 30px rgba(31,48,64,.08);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: var(--paper); color: var(--ink); font-family: "Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif; font-size: 15px; line-height: 1.65; padding-bottom: 60px; }
      a { color: var(--primary); }
      .top { position: sticky; top: 0; z-index: 10; background: rgba(251,252,253,.95); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
      .top .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .brand { font-weight: 700; font-size: 15px; line-height: 1.2; }
      .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
      nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
      nav a { text-decoration: none; color: var(--muted); font-size: 13.5px; padding: 6px 10px; border-radius: 8px; }
      nav a.on { background: var(--soft); color: var(--primary); font-weight: 700; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
      h1 { font-size: 21px; margin: 22px 0 4px; }
      h2 { font-size: 14.5px; font-weight: 700; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      h2 .cnt { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .help-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 13px; font-weight: 700; line-height: 20px; padding: 0; cursor: pointer; }
      .help-btn[aria-expanded="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      .line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .line:last-child { border-bottom: none; }
      .line .t { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 112px; }
      .line .w { flex: 1; min-width: 100px; }
      .line .w .nm { font-weight: 700; }
      .mono { font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted); }
      .small { font-size: 12.5px; }
      /* 予定の編集: 操作ボタンは右端。ボタンが1つの行(実施済)は折り返さず同じ行に収める */
      .slotline .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .slotline.tight { flex-wrap: nowrap; }
      .slotline.tight .time { min-width: 0; white-space: nowrap; }
      .slotline.tight .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .slotline.tight .acts { flex: none; }
      .slotline.tight .acts button { white-space: nowrap; padding: 4px 8px; }
      a.lesson-link { display: contents; color: inherit; text-decoration: none; }
      a.lesson-link:hover .who, a.lesson-link:focus-visible .who { text-decoration: underline; color: var(--primary); }
      a.lesson-link .who::after { content: ' ›'; color: var(--muted); }
      details.fold > summary { list-style: none; cursor: pointer; }
      details.fold > summary::-webkit-details-marker { display: none; }
      details.fold > summary h2 { margin-bottom: 8px; }
      details.fold > summary .mk::before { content: '▸'; display: inline-block; width: 1.1em; color: var(--muted); }
      details.fold[open] > summary .mk::before { content: '▾'; }
      .tag { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; font-weight: 700; white-space: nowrap; }
      .tag.blue { background: var(--soft); color: var(--primary); }
      .tag.amber { background: var(--amber-soft); color: var(--amber); }
      .tag.coral { background: var(--coral-soft); color: var(--coral); }
      .tag.green { background: var(--green-soft); color: var(--green); }
      .tag.gray { background: var(--taken); color: var(--muted); }
      .tag.red { background: var(--danger-soft); color: var(--danger); }
      button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 8px 13px; font-weight: 600; }
      button:disabled { opacity: .55; cursor: default; }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
      .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .btn-sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
      a.btn-sm { text-decoration: none; display: inline-block; }
      input, select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%; }
      textarea { width: 100%; min-height: 70px; resize: vertical; }
      input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
      .form { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
      .form label { font-size: 13px; color: var(--muted); white-space: nowrap; }
      .form .full { grid-column: 1 / -1; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
      .kv dt { color: var(--muted); font-size: 12.5px; margin: 0; }
      .kv dd { margin: 0; }
      .scard { display: block; text-decoration: none; color: inherit; }
      .scard:hover { border-color: var(--primary); }
      .scard .nm { font-weight: 700; font-size: 16px; }
      .stat { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .stat small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
      .empty { color: var(--muted); font-size: 13.5px; padding: 6px 2px; }
      .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
      .head h1 { margin: 0; }
      /* 先生ホームの実装プレビュー。採用時に旧ホームと切り替える。 */
      .home-work { margin-top: 18px; }
      .home-work .home-day { margin: 18px 0; }
      .home-schedule { display: grid; grid-template-columns: minmax(280px,.85fr) minmax(0,1.15fr); gap: 16px; align-items: start; margin: 18px 0; }
      .home-schedule > .home-day { min-width: 0; margin: 0; }
      .home-calendar { min-width: 0; padding: 14px 12px; }
      .home-calendar-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
      .home-calendar-head h2 { margin: 0; font-size: 16px; }
      .home-calendar-head h2::after { display: none; }
      .home-calendar-head .row { gap: 4px; }
      .home-calendar-head button { min-height: 40px; padding: 6px 10px; }
      .home-calendar-grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 2px; }
      .home-calendar-weekday { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0; }
      .home-calendar-day { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; min-height: 54px; padding: 4px 0; background: transparent; font-weight: 400; color: var(--ink); }
      .home-calendar-number { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; }
      .home-calendar-day.today .home-calendar-number { box-shadow: inset 0 0 0 1px var(--primary); color: var(--primary); }
      .home-calendar-day[aria-pressed="true"] { background: var(--soft); }
      .home-calendar-day[aria-pressed="true"] .home-calendar-number { background: var(--primary); color: white; }
      .home-calendar-count { font-size: 11px; min-height: 18px; color: var(--primary); font-variant-numeric: tabular-nums; }
      .home-calendar .note { margin-bottom: 0; }
      .home-schedule .home-lesson { grid-template-columns: 80px minmax(0,1fr); gap: 6px 10px; }
      .home-schedule .home-lesson .home-actions { grid-column: 1 / -1; max-width: none; }
      .home-day-footer { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
      @media (max-width: 700px) { .home-schedule { grid-template-columns: minmax(0,1fr); } }
      .home-day h2 { margin: 0 0 4px; font-size: 18px; }
      .home-day h2::after { display: none; }
      .home-lesson { display: grid; grid-template-columns: 106px minmax(0,1fr) auto; gap: 8px 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
      .home-lesson:last-child { border-bottom: 0; padding-bottom: 4px; }
      .home-lesson .home-time { font-weight: 700; font-variant-numeric: tabular-nums; }
      .home-lesson .home-person { min-width: 0; overflow-wrap: anywhere; }
      .home-person > a { font-weight: 700; color: inherit; text-decoration: none; }
      .home-person > a:hover { text-decoration: underline; }
      .home-lesson .home-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 270px; }
      .home-work .home-actions a, .home-work .home-actions button { min-height: 40px; display: inline-flex; align-items: center; }
      .home-fold { margin: 10px 0; border: 1px solid var(--line); border-radius: 12px; background: white; }
      .home-fold > summary { padding: 13px 16px; cursor: pointer; font-weight: 700; overflow-wrap: anywhere; }
      .home-fold > summary .cnt { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
      .home-fold > .home-fold-body { padding: 0 16px 16px; overflow-wrap: anywhere; }
      .home-fold .card { box-shadow: none; }
      .home-work .home-meta { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
      .home-work .home-section-title { margin: 24px 0 8px; }
      .home-work .line .w { overflow-wrap: anywhere; }
      .home-work a:focus-visible, .home-work summary:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
      @media (max-width: 600px) {
        .home-lesson { grid-template-columns: 86px minmax(0,1fr); gap: 6px 10px; }
        .home-lesson .home-actions { grid-column: 1 / -1; justify-content: flex-end; max-width: none; }
        .home-work .head .row { width: 100%; }
        .home-work .grid { grid-template-columns: minmax(0,1fr); }
      }
      .chart { width: 100%; height: auto; display: block; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
      .seg button { border: none; border-radius: 0; background: transparent; color: var(--muted); padding: 6px 12px; font-size: 13px; }
      .seg button.on { background: var(--soft); color: var(--primary); font-weight: 700; }
      table.tb { border-collapse: collapse; width: 100%; font-size: 13.5px; }
      table.tb th, table.tb td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
      table.tb th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .tbwrap { overflow-x: auto; }
      /* 案内の一覧: 表計算ソフトのような罫線つきの表(gap を罫線色で埋める) */
      .plan-grid { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, max-content) minmax(0, max-content) minmax(0, 1fr) minmax(0, max-content) minmax(0, max-content); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 4px 0 6px; max-width: 100%; }
      .plan-gh { background: var(--bg-soft, #f3f5f8); color: var(--muted); font-size: 12.5px; font-weight: 500; padding: 5px 8px; min-width: 0; overflow-wrap: anywhere; }
      .plan-gr { display: contents; }
      .plan-gc { background: #fff; padding: 6px 7px; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
      .plan-gc .sub { display: block; font-size: 12px; color: var(--muted); }
      @media (max-width: 480px) { .plan-gc { padding: 6px 6px; font-size: 14px; } .plan-gh { padding: 4px 6px; font-size: 12px; } }
      .plan-gs { grid-column: 1 / -1; background: #fff; padding: 4px 8px 8px; }
      .plan-gs:empty { display: none; }
      .usage-row { padding: 8px 0; border-top: 1px solid var(--line); }
      .usage-row:first-child { border-top: 0; padding-top: 0; }
      .usage-bar { display: flex; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
      .usage-bar .done { background: var(--primary); }
      .usage-bar .planned { background: var(--primary); opacity: .35; }
      table.extb td b { font-weight: 700; }
      table.extb tr.exsub td { padding-top: 0; border-bottom: 1px solid var(--line); }
      table.extb tr.exsub td .tag { display: inline-block; margin: 2px 4px 2px 0; }
      table.extb tr:has(+ tr.exsub) td { border-bottom: none; padding-bottom: 2px; }
      table.extb td.nw { white-space: nowrap; }
      #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 30; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 9px 18px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; }
      #toast.show { opacity: 1; }
      .loading { text-align: center; color: var(--muted); padding: 60px 0; }
      .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } #toast { transition: none; } }
      /* 予定表の見た目は共通部品 assets/calendar.css に集約(2026-09-19) */
      .loglist { font-size: 13px; color: var(--muted); }
      .loglist div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
      .loglist div:last-child { border-bottom: none; }
      details.add { margin-top: 10px; }
      details.add summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 13.5px; list-style: none; }
      details.add summary::before { content: "＋ "; }
      details.add[open] summary::before { content: "－ "; }
      details.add .card { margin-top: 8px; }
      .lc-label { display:block; font-size:13px; font-weight:600; margin:14px 0 5px; }
      .lc-text { white-space:pre-wrap; overflow-wrap:anywhere; }
      .lc-notice { background:var(--amber-soft); padding:12px; border-radius:10px; margin-top:12px; }
      .lc-overdue { color:var(--danger); }
      .lc-history { max-height:340px; overflow:auto; }
      @media(max-width:400px) { .grid2 { grid-template-columns:minmax(0,1fr); } }
      .wrap:has(.lesson-pair-grid) { max-width: 1500px; }
      .lesson-pair-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; align-items:start; }
      .lesson-pair-pane { min-width:0; border-top:5px solid var(--primary); padding-top:8px; }
      .lesson-pair-pane:nth-child(2) { border-top-color:#92712b; }
      .lesson-pair-pane .grid2 { grid-template-columns:1fr; }
      .lesson-pair-pane .head { position:sticky; top:64px; background:var(--bg,#f6f8fb); z-index:2; padding:8px; }
      @media(max-width:900px) { .lesson-pair-grid { grid-template-columns:1fr; } .lesson-pair-pane .head { position:static; } }
    </style>

            case "tdeloff":

              var tids = btn.getAttribute("data-ids");

              var lim = addDaysStr(A.today, 7);
              var wk = A.slots.filter(function (x) { return x.date >= A.today && x.date < lim && x.status === "booked"; }).sort(slotCmp);

        document.addEventListener("change", function (ev) {

        });
        load();
      })();
