<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0717a8" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>ステップワイズ 管理</title>
    <style>
      :root {
        --ink: #19212a; --muted: #64717f; --line: #dbe3ea; --paper: #fbfcfd; --soft: #eef4fb;
        --primary: #0717a8; --primary-dark: #07106f; --coral: #d86f8d; --coral-soft: #fbeef2;
        --amber: #a86f12; --amber-soft: #fdf3e3; --green: #2e8b57; --green-soft: #e6f4ec;
        --danger: #c0392b; --danger-soft: #fbe9e7; --taken: #eef1f4; --white: #fff;
        --shadow: 0 10px 30px rgba(31,48,64,.08);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: var(--paper); color: var(--ink); font-family: "Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif; font-size: 15px; line-height: 1.65; padding-bottom: 60px; }
      a { color: var(--primary); }
      .top { position: sticky; top: 0; z-index: 10; background: rgba(251,252,253,.95); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
      .top .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .brand { font-weight: 700; font-size: 15px; line-height: 1.2; }
      .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
      nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
      nav a { text-decoration: none; color: var(--muted); font-size: 13.5px; padding: 6px 10px; border-radius: 8px; }
      nav a.on { background: var(--soft); color: var(--primary); font-weight: 700; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
      h1 { font-size: 21px; margin: 22px 0 4px; }
      h2 { font-size: 14.5px; font-weight: 700; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      h2 .cnt { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      .line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .line:last-child { border-bottom: none; }
      .line .t { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 112px; }
      .line .w { flex: 1; min-width: 100px; }
      .line .w .nm { font-weight: 700; }
      .mono { font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted); }
      .small { font-size: 12.5px; }
      .tag { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; font-weight: 700; white-space: nowrap; }
      .tag.blue { background: var(--soft); color: var(--primary); }
      .tag.amber { background: var(--amber-soft); color: var(--amber); }
      .tag.coral { background: var(--coral-soft); color: var(--coral); }
      .tag.green { background: var(--green-soft); color: var(--green); }
      .tag.gray { background: var(--taken); color: var(--muted); }
      .tag.red { background: var(--danger-soft); color: var(--danger); }
      button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 8px 13px; font-weight: 600; }
      button:disabled { opacity: .55; cursor: default; }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
      .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .btn-sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
      a.btn-sm { text-decoration: none; display: inline-block; }
      input, select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%; }
      textarea { width: 100%; min-height: 70px; resize: vertical; }
      input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
      .form { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
      .form label { font-size: 13px; color: var(--muted); white-space: nowrap; }
      .form .full { grid-column: 1 / -1; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
      .kv dt { color: var(--muted); font-size: 12.5px; margin: 0; }
      .kv dd { margin: 0; }
      .scard { display: block; text-decoration: none; color: inherit; }
      .scard:hover { border-color: var(--primary); }
      .scard .nm { font-weight: 700; font-size: 16px; }
      .stat { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .stat small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
      .empty { color: var(--muted); font-size: 13.5px; padding: 6px 2px; }
      .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
      .head h1 { margin: 0; }
      .chart { width: 100%; height: auto; display: block; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
      .seg button { border-radius: 0; background: transparent; color: var(--muted); padding: 4px 10px; font-size: 12.5px; }
      .seg button.on { background: var(--soft); color: var(--primary); }
      table.tb { border-collapse: collapse; width: 100%; font-size: 13.5px; }
      table.tb th, table.tb td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
      table.tb th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .tbwrap { overflow-x: auto; }
      table.extb td b { font-weight: 700; }
      table.extb tr.exsub td { padding-top: 0; border-bottom: 1px solid var(--line); }
      table.extb tr.exsub td .tag { display: inline-block; margin: 2px 4px 2px 0; }
      table.extb tr:has(+ tr.exsub) td { border-bottom: none; padding-bottom: 2px; }
      table.extb td.nw { white-space: nowrap; }
      #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 30; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 9px 18px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; }
      #toast.show { opacity: 1; }
      .loading { text-align: center; color: var(--muted); padding: 60px 0; }
      .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } #toast { transition: none; } }
      .cal { padding: 12px 12px 10px; }
      .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .callabel { font-weight: 700; font-size: 15px; }
      .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
      .calwd { font-size: 11px; color: var(--muted); padding: 2px 0; }
      .calwd.sun { color: var(--danger); } .calwd.sat { color: var(--primary); }
      .calday { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px; padding: 4px 0 3px; min-height: 42px; border-radius: 9px; border: 1px solid transparent; background: transparent; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
      button.calday { cursor: pointer; font-size: 13px; }
      .calday.sun { color: var(--danger); } .calday.sat { color: var(--primary); }
      .calday.off { opacity: 0.35; }
      .calday.today { border-color: var(--muted); }
      .calday.sel { background: var(--primary); color: var(--white); border-color: var(--primary); }
      .caldot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
      .caldot.op { background: var(--primary); } .caldot.of { background: #d99a2b; } .caldot.rq { background: var(--danger); } .caldot.ws { background: var(--green); } .caldot.ev { background: var(--coral); }
      .calday.sel .caldot { background: var(--white); }
      .calmark { font-size: 10px; line-height: 1; color: var(--muted); font-weight: 700; }
      .calday.sel .calmark { color: var(--white); }
      .calmarks { display: flex; align-items: center; gap: 2px; min-height: 7px; }
      .callegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
      .callbl { display: block; max-width: 100%; font-size: 10px; line-height: 1.2; font-weight: 700; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .callbl.tm { font-weight: 600; opacity: .85; }
      .callbl.of { color: var(--amber); } .callbl.dn { color: var(--muted); } .callbl.ev { color: var(--coral); font-weight: 600; } .callbl.more { color: var(--muted); font-weight: 500; }
      .calday.sel .callbl { color: var(--white); }
      .callegend span { display: inline-flex; align-items: center; gap: 4px; }
      .loglist { font-size: 13px; color: var(--muted); }
      .loglist div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
      .loglist div:last-child { border-bottom: none; }
      details.add { margin-top: 10px; }
      details.add summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 13.5px; list-style: none; }
      details.add summary::before { content: "＋ "; }
      details.add[open] summary::before { content: "－ "; }
      details.add .card { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="top"><div class="in">
      <span class="brand">ステップワイズ 管理<small>英数教室・個別指導部</small></span>
      <nav id="nav"></nav>
    </div></div>
    <div class="wrap" id="app"><div class="loading"><div class="spinner"></div>読み込んでいます…</div></div>
    <div id="toast" role="status"></div>

    <script>
      (function () {
        "use strict";
        var API = "https://script.google.com/macros/s/AKfycbz53sl4GgKNY1UY1gaBndjDplQk5MrA9EfShYfy05Jl4JNEFEl7-B1uKSmd0v5Mhn4Irw/exec";
        var YOYAKU = "../yoyaku/";
        var app = document.getElementById("app");
        var nav = document.getElementById("nav");
        var WD = ["日","月","火","水","木","金","土"];
        var SUBJECT_COLOR = { "英語": "#3556c8", "数学": "#a86f12", "国語": "#7a4fc9", "理科": "#2e8b57", "社会": "#b8466f", "5教科": "#19212a", "3教科": "#6b7280" };
        var FALLBACK_COLORS = ["#6b7280", "#4b5563"];
        var D = null;      // ダッシュボード
        var cur = null;    // 表示中の生徒カルテ
        var busy = false;
        var authM = null;  // null=未確認 / 'login' / 'ok'
        var gradeMode = "score", examMode = "dev";
        var editProfile = false;
        var editEmail = false, editFee = false;

        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
        function token() { return lsGet("sw_admt") || ""; }
        function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
        function pad(n) { return String(n).length < 2 ? "0" + n : String(n); }
        function wdOf(ds) { var p = ds.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
        function fmtD(ds) { if (!ds || ds.length < 10) return esc(ds || ""); var p = ds.split("-"); return (+p[1]) + "/" + (+p[2]) + "(" + WD[wdOf(ds)] + ")"; }
        function fmtDY(ds) { if (!ds || ds.length < 10) return esc(ds || ""); var p = ds.split("-"); return p[0] + "/" + (+p[1]) + "/" + (+p[2]); }
        function endTime(start, min) { var p = start.split(":"); var t = (+p[0]) * 60 + (+p[1]) + (+min); return pad(Math.floor(t / 60) % 24) + ":" + pad(t % 60); }
        function yen(n) { return (Number(n) || 0).toLocaleString() + "円"; }
        function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
        function thisYm() { return today().slice(0, 7); }
        var toastTimer = null;
        function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800); }
        function val(id) { var el = document.getElementById(id); return el ? String(el.value || "").trim() : ""; }
        function halfDigits(s) { return String(s || "").replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).trim(); }
        function copyText(text, okMsg) {
          function fallback() {
            var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(ta); toast(ok ? okMsg : "コピーできませんでした");
          }
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
          else fallback();
        }
        function studentLink(code) { return new URL(YOYAKU + "?k=" + code, location.href).href; }

        function post(body) { return fetch(API, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
        function admin(op, extra) {
          var body = { action: "admin", token: token(), op: op, from: "kanri", view: viewOf() };
          Object.keys(extra || {}).forEach(function (k) { body[k] = extra[k]; });
          var t0 = Date.now();
          return post(body).then(function (res) {
            try { console.log("[kanri] " + op + " " + (Date.now() - t0) + "ms (server " + (res && res.ms) + "ms)"); } catch (e) {}
            if (res && res.badAuth) { lsDel("sw_admt"); authM = "login"; render(); throw new Error("ログインし直してください"); }
            if (res && res.error) throw new Error(res.error);
            return res;
          });
        }

        /* ---------- 端末内キャッシュ(前回の内容を先に表示し、裏で最新に差し替える) ---------- */
        var CK = "sw_kanri_c";
        function cacheAll() { try { return JSON.parse(lsGet(CK) || "{}") || {}; } catch (e) { return {}; } }
        function cacheGet(key) { var c = cacheAll()[key]; return c && c.data ? c.data : null; }
        function cachePut(key, data) { var c = cacheAll(); c[key] = { at: Date.now(), data: data }; lsSet(CK, JSON.stringify(c)); }
        function cacheClear() { lsDel(CK); }
        function keyOf(r) { return r.page === "student" ? "s:" + r.id : (r.page === "lessons" || r.page === "settings") ? "lessons" : "home"; }
        var syncMsg = "";   // 右上に出す「更新中…」「保存中…」
        var skipLoad = false; // addstudent 後に hash を変えるとき、再取得しない

        /* ---------- 授業ページ(予約ページの先生モードから移植) ---------- */
        var A = null; // 予約システムの全データ(slots/students/blocked/log)
        var calNow = new Date(), calY = calNow.getFullYear(), calM = calNow.getMonth();
        var selDate = null, selManual = false, offerDraft = null;
        function isLessons(r) { return r.page === "lessons" || r.page === "settings"; }
        function viewOf() { var p = route().page; return p === "student" ? "student" : (p === "lessons" || p === "settings") ? "lessons" : "home"; }
        function sameId(a, b) { return String(a) === String(b); }
        function addDaysStr(ds, n) { var p = ds.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
        function groupBlocked(list) {
          var sorted = list.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
          var groups = [], g = null;
          sorted.forEach(function (b) {
            if (g && String(b.note || "") === g.note && b.date === addDaysStr(g.end, 1)) { g.end = b.date; g.ids.push(b.id); }
            else { g = { start: b.date, end: b.date, note: String(b.note || ""), ids: [b.id] }; groups.push(g); }
          });
          return groups;
        }
        function rangeLabel(g) { return g.start === g.end ? fmtD(g.start) : fmtD(g.start) + "〜" + fmtD(g.end); }
        function evRange(e) { return e.date === e.dateTo ? fmtD(e.date) : fmtD(e.date) + "〜" + fmtD(e.dateTo); }
        function eventRow(e, showName) {
          return '<div class="line"><span class="t">' + evRange(e) + '</span><span class="w">' + (showName ? '<a class="nm" href="#s=' + esc(e.studentId) + '" style="text-decoration:none;color:inherit">' + esc(e.studentName) + '</a> ' : '') + '<span class="tag coral">共有予定</span> ' + esc(e.title) + '</span>' +
            '<button class="btn-quiet btn-sm" data-action="delevent" data-id="' + esc(e.id) + '" data-sid="' + esc(e.studentId) + '">削除</button></div>';
        }
        function slotCmp(a, b) { return a.date === b.date ? (a.start < b.start ? -1 : 1) : (a.date < b.date ? -1 : 1); }
        function minutesBetween(s, e) { var a = s.split(":"), b = e.split(":"); return (+b[0]) * 60 + (+b[1]) - (+a[0]) * 60 - (+a[1]); }
        function fitMin(m) { var opts = [120, 90, 60, 45, 30]; for (var i = 0; i < opts.length; i++) if (m >= opts[i]) return opts[i]; return 60; }
        function wishRow(x, showName) {
          var want = x.kind === "want";
          var h = '<div class="line"><span class="t">' + fmtD(x.date) + ' ' + x.start + '〜' + x.end + '</span><span class="w">' +
            (showName ? '<a class="nm" href="#s=' + esc(x.studentId) + '" style="text-decoration:none;color:inherit">' + esc(x.studentName) + '</a> ' : '') +
            '<span class="tag ' + (want ? "blue" : "green") + '">' + (want ? "この日時を希望" : "この時間帯のどこかで") + '</span> ' +
            (x.note ? '<span class="small">' + esc(x.note) + '</span>' : '') + (x.createdAt ? ' <span class="small muted">(' + esc(x.createdAt) + ')</span>' : '') + '</span>';
          h += '<button class="btn-ghost btn-sm" data-action="usewish" data-id="' + esc(x.id) + '" data-sid="' + esc(x.studentId) + '" data-kind="' + esc(x.kind || "ok") + '" data-date="' + esc(x.date) + '" data-start="' + esc(x.start) + '" data-end="' + esc(x.end) + '">' + (want ? "この希望で案内" : "この時間帯で案内") + '</button>';
          h += '<button class="btn-quiet btn-sm" data-action="delwish" data-id="' + esc(x.id) + '" data-sid="' + esc(x.studentId) + '">削除</button></div>';
          return h;
        }
        // 案内フォーム(授業ページ・カルテ共用)。fixedStudent を渡すと生徒は固定
        function offerForm(today, students, fixedStudent) {
          var d = offerDraft || {};
          var h = '<div class="card"><div class="form">';
          if (fixedStudent) h += '<input type="hidden" id="f-student" value="' + esc(fixedStudent.id) + '">';
          else h += '<label for="f-student">生徒</label><select id="f-student"><option value="">えらんでください</option>' + students.map(function (x) { return '<option value="' + esc(x.id) + '"' + (sameId(d.studentId, x.id) ? " selected" : "") + '>' + esc(x.name) + '</option>'; }).join("") + '</select>';
          h += '<label for="f-subject">科目</label><select id="f-subject"><option value="">(科目なし)</option>' + ["英語", "数学", "英数", "国語", "理科", "社会"].map(function (s) { return '<option' + (d.subject === s ? " selected" : "") + '>' + s + '</option>'; }).join("") + '</select>';
          h += '<label for="f-date">日付</label><input type="date" id="f-date" min="' + today + '" value="' + (d.date || today) + '">';
          h += '<label for="f-start">開始</label><input type="time" id="f-start" value="' + (d.start || "17:00") + '" step="300">';
          h += '<label for="f-min">長さ</label><select id="f-min">' + [30, 45, 60, 90, 120].map(function (m) { return '<option value="' + m + '"' + (m === (+d.min || 90) ? " selected" : "") + '>' + m + '分</option>'; }).join("") + '</select>';
          h += '<label for="f-rep">くり返し</label><select id="f-rep"><option value="1">この日だけ</option><option value="2">毎週×2回</option><option value="4">毎週×4回</option><option value="8">毎週×8回</option><option value="12">毎週×12回</option></select>';

        // 授業ページの書き込み(結果の admin をそのまま採用)
        function actA(op, extra, okMsg) {
          if (busy) return;
          busy = true; syncMsg = "保存中…"; render();
          admin(op, extra).then(function (res) {
            busy = false; syncMsg = ""; offerDraft = null;
            if (okMsg) toast(okMsg);
            if (!applyResult(res, route())) load(true); else render();
          }).catch(function (e) { busy = false; syncMsg = ""; toast(e.message); render(); });
        }
        function sendOffer(force) {
          if (!offerDraft || busy) return;
          busy = true; syncMsg = "送信中…"; render();
          var body = { action: "admin", token: token(), op: "offer", from: "kanri", view: viewOf(), force: !!force };
          ["studentId", "date", "start", "min", "repeat", "subject", "wishId"].forEach(function (k2) { if (offerDraft[k2]) body[k2] = offerDraft[k2]; });
          post(body).then(function (res) {
            busy = false; syncMsg = "";
            if (res.badAuth) { lsDel("sw_admt"); authM = "login"; render(); return; }
            if (res.error) {
              if (res.needForce) { if (confirm(res.error + "\n\nそれでも案内しますか?")) { sendOffer(true); return; } render(); return; }
              toast(res.error); render(); return;
            }
            var d = offerDraft; offerDraft = null;
            if (!applyResult(res, route())) load(true);
            selDate = d.date; selManual = true;
            render(); toast("案内を送りました");
          }).catch(function () { busy = false; syncMsg = ""; toast("通信に失敗しました"); render(); });
        }

          else if (r.page === "home" && D) renderHome();
          else renderLoading();

        /* ---------- 操作 ---------- */
        // 書き込み: optimistic(画面を先に書き換える関数)があれば即反映し、裏で保存。サーバーの返した最新データで置き換える
        function act(op, extra, okMsg, optimistic) {
          if (busy) return;
          var r = route();
          if (optimistic) { try { optimistic(); } catch (e) {} }
          busy = true; syncMsg = "保存中…"; render();
          admin(op, extra).then(function (res) {
            busy = false; syncMsg = "";
            if (okMsg) toast(okMsg);
            if (!applyResult(res, r)) load(true); else render();
          }).catch(function (e) { busy = false; syncMsg = ""; toast(e.message); load(true); });
        }
        // サーバーが返した最新データを画面に反映。反映できたら true
        function applyResult(res, r) {
          var now = route();
          if (res.admin && res.admin.slots) { A = res.admin; cachePut("lessons", A); return isLessons(now); }
          if (res.dash) { D = res.dash; cachePut("home", D); return now.page === "home" || now.page === "students"; }
          if (res.data && res.data.lessons) {
            cachePut("s:" + res.data.id, res.data);

        function findRow(list, row) { for (var i = 0; i < list.length; i++) if (list[i].row === row) return list[i]; return null; }

              }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });

            case "exmode": examMode = btn.getAttribute("data-m"); render(); break;
            case "addexam":
              var EXK = ["国語", "数学", "社会", "理科", "英語", "3教科", "5教科"];
              var ex = { name: val("ex-name"), round: val("ex-round"), date: val("ex-date"), grade: val("ex-grade"), rank3: val("ex-r3"), rank5: val("ex-r5"), judge: val("ex-judge"), url: val("ex-url"), note: val("ex-note"), scores: {} };
              EXK.forEach(function (k, i) { ex.scores[k] = { score: val("ex-s" + i), dev: val("ex-d" + i) }; });
              if (!/^\d{4}-\d{2}-\d{2}$/.test(ex.date)) { toast("日付をえらんでください"); return; }
              if (!ex.name) { toast("模試名を入れてください"); return; }
              act("kanriAddExam", Object.assign({ studentId: sid }, ex), "模試の結果を記録しました", function () {
                var n2 = function (v) { return v === "" || isNaN(+v) ? null : +v; };
                var subj = {}; EXAM_SUBJ.forEach(function (k) { subj[k] = { score: n2(ex.scores[k].score), dev: n2(ex.scores[k].dev) }; });
                cur.exams = (cur.exams || []).concat([{ row: null, date: ex.date, name: ex.name, round: ex.round, grade: ex.grade, subjects: subj,
                  total3: { score: n2(ex.scores["3教科"].score), dev: n2(ex.scores["3教科"].dev) }, total5: { score: n2(ex.scores["5教科"].score), dev: n2(ex.scores["5教科"].dev) },
                  rank3: ex.rank3, rank5: ex.rank5, n: "", judge: ex.judge.split(/\n/).map(function (x) { return x.trim(); }).filter(Boolean), url: ex.url, note: ex.note }])
                  .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
              });
              break;
            case "addgrade":
              var gr = { date: val("g-date"), test: val("g-test"), subject: val("g-subject"), score: val("g-score"), max: val("g-max"), dev: val("g-dev"), rank: val("g-rank"), note: val("g-note") };
              if (!/^\d{4}-\d{2}-\d{2}$/.test(gr.date)) { toast("日付をえらんでください"); return; }
              if (gr.score === "" || isNaN(+gr.score)) { toast("点数を入れてください"); return; }
              act("kanriAddGrade", Object.assign({ studentId: sid }, gr), "成績を記録しました", function () {
                cur.grades.push({ row: null, date: gr.date, test: gr.test, subject: gr.subject, score: +gr.score, max: +gr.max || null, dev: gr.dev === "" ? null : +gr.dev, rank: gr.rank, note: gr.note });
                cur.grades.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
              });
              break;
            case "addpayment":
              var pm = { ym: val("p-ym"), amount: val("p-amount"), billDate: val("p-bill"), paidDate: val("p-paid"), method: val("p-method"), note: val("p-note") };
              if (!/^\d{4}-\d{2}$/.test(pm.ym)) { toast("年月をえらんでください"); return; }
              if (!(+pm.amount > 0)) { toast("請求額を入れてください"); return; }
              act("kanriAddPayment", Object.assign({ studentId: sid }, pm), "請求を記録しました", function () { addPaymentLocal(pm); });
              break;
            case "billmonth":
              var bm = { ym: cur.month, amount: cur.thisMonth.fee, billDate: today(), paidDate: "", method: "", note: cur.thisMonth.count + "回・" + cur.thisMonth.minutes + "分" };
              act("kanriAddPayment", Object.assign({ studentId: sid }, bm), "今月分を請求に記録しました", function () { addPaymentLocal(bm); });
              break;
            case "paid":
              var prow = +btn.getAttribute("data-row");
              act("kanriSetPaid", { studentId: sid, row: prow, paidDate: today() }, "入金済にしました", function () {
                if (route().page === "student") { var pp = findRow(cur.payments, prow); if (pp) { pp.status = "入金済"; pp.paidDate = today(); pp.method = ""; } }
                else { D.unpaid = removeRow(D.unpaid, prow); D.students.forEach(function (s) { if (String(s.id) === String(sid) && s.unpaid > 0) s.unpaid--; }); }
              });
              break;
            case "unpaid":
              var urow = +btn.getAttribute("data-row");
              act("kanriSetPaid", { studentId: sid, row: urow, unpaid: true }, "未入金に戻しました", function () {
                var up = findRow(cur.payments, urow); if (up) { up.status = "未入金"; up.paidDate = ""; up.method = ""; }
              });
              break;
            case "addmeeting":
              var mt = { date: val("m-date") || today(), who: val("m-who"), method: val("m-method"), content: val("m-content"), next: val("m-next") };
              if (!mt.content) { toast("内容を入れてください"); return; }
              act("kanriAddMeeting", Object.assign({ studentId: sid }, mt), "記録しました", function () {
                cur.meetings.unshift({ row: null, date: mt.date, who: mt.who, method: mt.method, content: mt.content, next: mt.next });
                cur.meetings.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
              });
              break;
            case "addstudent":
              var nn = val("n-name"), ne = val("n-email");
              if (!nn) { toast("名前を入れてください"); return; }
              busy = true; syncMsg = "追加中…"; render();
              admin("addStudent", { name: nn, email: ne }).then(function (res) {
                busy = false; syncMsg = ""; toast(nn + "さんを追加しました");
                if (res.data && res.data.lessons) {
                  cur = res.data; cachePut("s:" + res.data.id, res.data); skipLoad = true;
                  location.hash = "#s=" + encodeURIComponent(res.data.id);
                } else load(true);
              }).catch(function (e) { busy = false; syncMsg = ""; toast(e.message); render(); });
              break;
            case "copylink":
              if (!cur.code) { toast("リンクがまだ発行されていません"); return; }
              copyText(studentLink(cur.code), cur.name + "さんの専用リンクをコピーしました。LINEで送ってください");
              break;
            case "relink":
              if (!confirm(cur.name + "さんの専用リンクを再発行しますか?\nいま配っているリンクは使えなくなります。")) return;
              busy = true; syncMsg = "再発行中…"; render();
              admin("newCode", { studentId: sid }).then(function (res) {
                busy = false; syncMsg = "";
                var nc = res.data && res.data.code;
                if (nc) copyText(studentLink(nc), "再発行し、新しいリンクをコピーしました(前のリンクは無効です)");
                if (!applyResult(res, route())) load(true); else render();
              }).catch(function (e) { busy = false; syncMsg = ""; toast(e.message); render(); });
              break;
            case "editemail": editEmail = !editEmail; editFee = false; render(); break;
            case "editfee": editFee = !editFee; editEmail = false; render(); break;
            case "saveemail":
              var em2 = val("e-email"); editEmail = false;
              act("setEmail", { studentId: sid, email: em2 }, em2 ? "メールを登録しました" : "メールを削除しました", function () { cur.email = em2; });
              break;
            case "savefee":
              var rv = +(val("e-rate") || 0), mv = +(val("e-monthly") || 0); editFee = false;
              act("setFee", { studentId: sid, rate30: rv, monthly: mv }, "料金を設定しました", function () {
                cur.rate30 = rv; cur.monthly = mv;
                cur.thisMonth.mode = mv > 0 ? "monthly" : "time";
                cur.thisMonth.fee = mv > 0 ? mv : Math.round(cur.thisMonth.minutes / 30 * rv);
              });
              break;
            case "setactive":
              var on = btn.getAttribute("data-on") === "1";
              if (!on && !confirm(cur.name + "さんを予約ページから外しますか?\n(記録は残ります。あとで戻せます)")) return;
              act("kanriSetActive", { studentId: sid, active: on }, on ? "予約ページに戻しました" : "予約ページから外しました", function () { cur.active = on; });
              break;
            case "cancelok":
            case "cancelkeep":
              var csl = btn.getAttribute("data-id"), approve = a === "cancelok";
              if (approve && !confirm("この授業を取消にしますか?\nカレンダーの予定も削除されます。")) return;
              act("resolveCancel", { slotId: csl, approve: approve, studentId: sid }, approve ? "取消にしました" : "予定どおり行うことにしました", function () {
                if (!D) return;
                D.cancelReqs = (D.cancelReqs || []).filter(function (x) { return String(x.id) !== String(csl); });
                var strip = function (list) { return approve ? list.filter(function (x) { return String(x.id) !== String(csl); }) : list.map(function (x) { if (String(x.id) === String(csl)) x.req = null; return x; }); };
                D.lessonsToday = strip(D.lessonsToday); D.lessonsWeek = strip(D.lessonsWeek);
              });
              break;
            case "calprev": calM--; if (calM < 0) { calM = 11; calY--; } render(); break;
            case "calnext": calM++; if (calM > 11) { calM = 0; calY++; } render(); break;
            case "calday":
              selDate = btn.getAttribute("data-date"); selManual = true;
              offerDraft = { studentId: val("f-student"), subject: val("f-subject"), start: val("f-start"), min: val("f-min"), date: selDate, wishId: offerDraft && offerDraft.wishId };
              render(); break;
            case "offerslot":
              var stid = val("f-student"), odate = val("f-date"), ostart = val("f-start");
              if (!stid) { toast("生徒をえらんでください"); return; }
              if (!odate || !ostart) { toast("日付と時間を入れてください"); return; }
              offerDraft = { studentId: stid, date: odate, start: ostart, min: +(val("f-min") || 60), repeat: +(val("f-rep") || 1), subject: val("f-subject"), wishId: offerDraft && offerDraft.wishId };
              sendOffer(false); break;
            case "usewish":
              var uwWant = btn.getAttribute("data-kind") === "want", uwLen = minutesBetween(btn.getAttribute("data-start"), btn.getAttribute("data-end"));
              var uw = { studentId: btn.getAttribute("data-sid"), date: btn.getAttribute("data-date"), start: btn.getAttribute("data-start"), min: uwWant ? fitMin(uwLen) : Math.min(90, fitMin(uwLen)), wishId: btn.getAttribute("data-id"), window: uwWant ? "" : btn.getAttribute("data-start") + "〜" + btn.getAttribute("data-end") };
              var srcSlots = route().page === "student" ? (cur.lessons || []).map(function (l) { return { studentId: cur.id, date: l.date, subject: l.subject }; }) : (A ? A.slots : []);
              var lsub = "", ld = "";
              srcSlots.forEach(function (s) { if (sameId(s.studentId, uw.studentId) && s.subject && s.date >= ld) { ld = s.date; lsub = s.subject; } });
              uw.subject = lsub;
              offerDraft = uw; selDate = uw.date; selManual = true;
              render();
              var fe = document.getElementById("f-date"); if (fe) fe.scrollIntoView({ behavior: "smooth", block: "center" });
              toast(uwWant ? "希望日時をフォームに入れました。内容を確認して案内してください" : "空き時間 " + uw.window + " のあいだで開始時刻と長さを決めて案内してください");
              break;
            case "delevent":
              if (!confirm("この共有予定を削除しますか?(生徒の画面からも消えます)")) return;
              if (route().page === "student") act("delEvent", { eventId: btn.getAttribute("data-id"), studentId: sid }, "削除しました", function () { cur.events = (cur.events || []).filter(function (x) { return String(x.id) !== btn.getAttribute("data-id"); }); });
              else actA("delEvent", { eventId: btn.getAttribute("data-id") }, "削除しました");
              break;
            case "delwish":
              if (!confirm("この希望日程を削除しますか?")) return;
              if (route().page === "student") act("delWish", { wishId: btn.getAttribute("data-id"), studentId: sid }, "削除しました", function () { cur.wishes = (cur.wishes || []).filter(function (x) { return String(x.id) !== btn.getAttribute("data-id"); }); });
              else actA("delWish", { wishId: btn.getAttribute("data-id") }, "削除しました");
              break;
            case "delslot":
              if (!confirm("この案内を取り下げますか?")) return;
              (route().page === "student" ? act : actA)("deleteSlot", { slotId: btn.getAttribute("data-id"), studentId: sid }, "取り下げました"); break;
            case "unbook":
              if (!confirm(btn.getAttribute("data-name") + "さんの " + btn.getAttribute("data-when") + " の授業を解除しますか?\nカレンダーの予定も削除されます。生徒への連絡は別途お願いします。")) return;
              (route().page === "student" ? act : actA)("unbook", { slotId: btn.getAttribute("data-id"), studentId: sid }, "解除しました"); break;
            case "toggledone":
              (route().page === "student" ? act : actA)("toggleDone", { slotId: btn.getAttribute("data-id"), studentId: sid }); break;
            case "taddblock":
              var bs = val("b-student"), bd = val("b-date"), bd2 = val("b-date2");
              if (!bs) { toast("生徒をえらんでください"); return; }
              if (!bd) { toast("日付をえらんでください"); return; }
              actA("addBlock", { studentId: bs, date: bd, dateTo: bd2 || bd, note: val("b-note") }, "登録しました"); break;
            case "tdelblock":
              var tids = btn.getAttribute("data-ids");
              actA("delBlock", tids ? { blockIds: tids.split(",") } : { blockId: btn.getAttribute("data-id") }, "削除しました"); break;
            case "copyweek":
              var lim = addDaysStr(A.today, 7);
              var wk = A.slots.filter(function (x) { return x.date >= A.today && x.date < lim && x.status === "booked"; }).sort(slotCmp);
              if (!wk.length) { toast("今後7日の授業はありません"); return; }
              copyText(["【今週の授業予定】"].concat(wk.map(function (x) { return fmtD(x.date) + " " + x.start + "〜" + endTime(x.start, x.min) + " " + x.studentName + "さん" + (x.subject ? "(" + x.subject + ")" : ""); })).join("\n"), "今後7日の予定をコピーしました");
              break;
            case "copybill":
              var mk2 = btn.getAttribute("data-month"), sid3 = btn.getAttribute("data-id"), stu = null;
              A.students.forEach(function (x) { if (sameId(x.id, sid3)) stu = x; });
              if (!stu) { toast("生徒が見つかりません"); return; }
              var lessons = A.slots.filter(function (x) { return sameId(x.studentId, sid3) && x.status === "booked" && x.done && x.date.slice(0, 7) === mk2; }).sort(slotCmp);
              if (!lessons.length) { toast("実施済みの授業がありません"); return; }
              var totalMin = 0, lines2 = ["【" + (+mk2.slice(5, 7)) + "月分 授業料のご案内】" + stu.name + "さん", ""];
              lessons.forEach(function (x) { totalMin += Number(x.min) || 0; lines2.push("・" + fmtD(x.date) + " " + x.start + "〜" + endTime(x.start, x.min) + "(" + x.min + "分" + (x.subject ? "・" + x.subject : "") + ")"); });
              lines2.push("");
              lines2.push(stu.monthly > 0 ? "月謝: " + stu.monthly.toLocaleString() + "円(実施 " + lessons.length + "回)" : "合計: " + lessons.length + "回・" + totalMin + "分 = " + Math.round(totalMin / 30 * (stu.rate30 || 0)).toLocaleString() + "円");
              copyText(lines2.join("\n"), "請求文面をコピーしました。LINEに貼り付けできます");
              break;
            case "changepass":
              var cpw = (document.getElementById("f-curpass") || {}).value || "", npw = (document.getElementById("f-newpass") || {}).value || "";
              if (npw.length < 8) { toast("新しいパスワードは8文字以上にしてください"); return; }
              actA("changePass", { current: cpw, newPass: npw }, "パスワードを変更しました"); break;
            case "dayoffer":
              offerDraft = Object.assign({}, offerDraft || {}, { studentId: cur.id, date: btn.getAttribute("data-date") });
              render();
              var fd = document.getElementById("f-date"); if (fd) fd.scrollIntoView({ behavior: "smooth", block: "center" });
              toast(fmtD(btn.getAttribute("data-date")) + " を案内フォームに入れました");
              break;
            case "planpropose":
              act("planPropose", { studentId: sid, ym: btn.getAttribute("data-ym") }, "保護者に提案しました(承認待ち)");
              break;
            case "planapprove":
              var pvia = val("pl-via-" + btn.getAttribute("data-ym")) || "LINE";
              if (!confirm(btn.getAttribute("data-ym") + " の授業回数について、" + pvia + "で保護者の承諾を得たものとして記録しますか?")) return;
              act("planApproveTeacher", { studentId: sid, ym: btn.getAttribute("data-ym"), via: pvia }, "承諾を記録しました");
              break;
            case "plancopy":
              var pym = btn.getAttribute("data-ym"), pm2 = ((cur.plan || {}).months || []).filter(function (m) { return m.ym === pym; })[0];
              if (!pm2 || !pm2.rows.length) { toast("計画がありません"); return; }
              var ptext = "【" + (+pym.slice(5)) + "月の授業回数のご確認】" + cur.name + "さん\n" + pm2.rows.map(function (x) { return "・" + x.subject + " " + x.count + "回"; }).join("\n") + "\n合計 " + pm2.total + "回の予定です。\n\nよろしければ、マイページの「保護者」タブから承認をお願いします(LINEでのお返事でも結構です)。\n" + studentLink(cur.code || "");
              copyText(ptext, "保護者への連絡文をコピーしました。LINEに貼り付けできます");
              break;
            case "taskadd":
              var tkt = val("tk-title");
              if (!tkt) { toast("内容を入れてください"); return; }
              act("taskAdd", { studentId: sid, type: val("tk-type"), title: tkt, due: val("tk-due") }, "登録しました");
              break;
            case "taskdone":
              act("taskDone", { studentId: sid, taskId: btn.getAttribute("data-id"), done: btn.getAttribute("data-done") === "1" }, "更新しました");
              break;
            case "taskdel":
              if (!confirm("この宿題・持ち物を削除しますか?")) return;
              act("taskDel", { studentId: sid, taskId: btn.getAttribute("data-id") }, "削除しました");
              break;
            case "plansave":
              act("planSet", { studentId: sid, ym: val("pl-scope"), subject: val("pl-subject"), count: +(val("pl-count") || 0) }, "計画を保存しました");
              break;
            case "delrow":
              if (!confirm("この記録を削除しますか?")) return;
              var dsh = btn.getAttribute("data-sheet"), drow = +btn.getAttribute("data-row");
              act("kanriDeleteRow", { studentId: sid, sheet: dsh, row: drow }, "削除しました", function () {
                if (dsh === "成績推移") cur.grades = removeRow(cur.grades, drow);
                else if (dsh === "入金管理") { cur.payments = removeRow(cur.payments, drow); cur.thisMonth.billed = cur.payments.some(function (p) { return p.ym === cur.month; }); }
                else if (dsh === "面談記録") cur.meetings = removeRow(cur.meetings, drow);
                else if (dsh === "模試") cur.exams = removeRow(cur.exams || [], drow);
              });
              break;
          }
        });

        document.addEventListener("change", function (ev) {
          if (!ev.target || ev.target.id !== "f-student" || !A) return;
          var sel = document.getElementById("f-subject"); if (!sel) return;
          var latest = "", latestDate = "";
          (A.slots || []).forEach(function (s) { if (sameId(s.studentId, ev.target.value) && s.subject && s.date >= latestDate) { latestDate = s.date; latest = s.subject; } });
          sel.value = latest || "";
          offerDraft = { studentId: ev.target.value, subject: sel.value, date: val("f-date"), start: val("f-start"), min: val("f-min"), wishId: offerDraft && offerDraft.wishId, window: offerDraft && offerDraft.window };
          render();
        });

        load();
      })();
    </script>
  </body>
</html>
