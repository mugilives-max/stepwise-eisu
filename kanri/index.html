<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ステップワイズ 管理</title>
    <style>
      :root {
        --ink: #19212a; --muted: #64717f; --line: #dbe3ea; --paper: #fbfcfd; --soft: #eef4fb;
        --primary: #0717a8; --primary-dark: #07106f; --coral: #d86f8d; --coral-soft: #fbeef2;
        --amber: #a86f12; --amber-soft: #fdf3e3; --green: #2e8b57; --green-soft: #e6f4ec;
        --danger: #c0392b; --danger-soft: #fbe9e7; --taken: #eef1f4; --white: #fff;
        --shadow: 0 10px 30px rgba(31,48,64,.08);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: var(--paper); color: var(--ink); font-family: "Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif; font-size: 15px; line-height: 1.65; padding-bottom: 60px; }
      a { color: var(--primary); }
      .top { position: sticky; top: 0; z-index: 10; background: rgba(251,252,253,.95); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
      .top .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .brand { font-weight: 700; font-size: 15px; line-height: 1.2; }
      .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
      nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
      nav a { text-decoration: none; color: var(--muted); font-size: 13.5px; padding: 6px 10px; border-radius: 8px; }
      nav a.on { background: var(--soft); color: var(--primary); font-weight: 700; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
      h1 { font-size: 21px; margin: 22px 0 4px; }
      h2 { font-size: 14.5px; font-weight: 700; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      h2 .cnt { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      .line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .line:last-child { border-bottom: none; }
      .line .t { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 112px; }
      .line .w { flex: 1; min-width: 100px; }
      .line .w .nm { font-weight: 700; }
      .mono { font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted); }
      .small { font-size: 12.5px; }
      .tag { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; font-weight: 700; white-space: nowrap; }
      .tag.blue { background: var(--soft); color: var(--primary); }
      .tag.amber { background: var(--amber-soft); color: var(--amber); }
      .tag.coral { background: var(--coral-soft); color: var(--coral); }
      .tag.green { background: var(--green-soft); color: var(--green); }
      .tag.gray { background: var(--taken); color: var(--muted); }
      .tag.red { background: var(--danger-soft); color: var(--danger); }
      button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 8px 13px; font-weight: 600; }
      button:disabled { opacity: .55; cursor: default; }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
      .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .btn-sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
      a.btn-sm { text-decoration: none; display: inline-block; }
      input, select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%; }
      textarea { width: 100%; min-height: 70px; resize: vertical; }
      input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
      .form { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
      .form label { font-size: 13px; color: var(--muted); white-space: nowrap; }
      .form .full { grid-column: 1 / -1; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
      .kv dt { color: var(--muted); font-size: 12.5px; margin: 0; }
      .kv dd { margin: 0; }
      .scard { display: block; text-decoration: none; color: inherit; }
      .scard:hover { border-color: var(--primary); }
      .scard .nm { font-weight: 700; font-size: 16px; }
      .stat { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .stat small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
      .empty { color: var(--muted); font-size: 13.5px; padding: 6px 2px; }
      .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
      .head h1 { margin: 0; }
      .chart { width: 100%; height: auto; display: block; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
      .seg button { border-radius: 0; background: transparent; color: var(--muted); padding: 4px 10px; font-size: 12.5px; }
      .seg button.on { background: var(--soft); color: var(--primary); }
      table.tb { border-collapse: collapse; width: 100%; font-size: 13.5px; }
      table.tb th, table.tb td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
      table.tb th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .tbwrap { overflow-x: auto; }
      table.extb td b { font-weight: 700; }
      table.extb tr.exsub td { padding-top: 0; border-bottom: 1px solid var(--line); }
      table.extb tr.exsub td .tag { display: inline-block; margin: 2px 4px 2px 0; }
      table.extb tr:has(+ tr.exsub) td { border-bottom: none; padding-bottom: 2px; }
      table.extb td.nw { white-space: nowrap; }
      #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 30; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 9px 18px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; }
      #toast.show { opacity: 1; }
      .loading { text-align: center; color: var(--muted); padding: 60px 0; }
      .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } #toast { transition: none; } }
      .cal { padding: 12px 12px 10px; }
      .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .callabel { font-weight: 700; font-size: 15px; }
      .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
      .calwd { font-size: 11px; color: var(--muted); padding: 2px 0; }
      .calwd.sun { color: var(--danger); } .calwd.sat { color: var(--primary); }
      .calday { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px; padding: 4px 0 3px; min-height: 42px; border-radius: 9px; border: 1px solid transparent; background: transparent; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
      button.calday { cursor: pointer; font-size: 13px; }
      .calday.sun { color: var(--danger); } .calday.sat { color: var(--primary); }
      .calday.off { opacity: 0.35; }
      .calday.toff:not(.sel) { background: repeating-linear-gradient(135deg, var(--taken) 0 3px, transparent 3px 7px); }
      .callbl.to { color: var(--muted); font-weight: 600; }
      .calday.today { border-color: var(--muted); }
      .calday.sel { background: var(--primary); color: var(--white); border-color: var(--primary); }
      .caldot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
      .caldot.op { background: var(--primary); } .caldot.of { background: #d99a2b; } .caldot.rq { background: var(--danger); } .caldot.ws { background: var(--green); } .caldot.ev { background: var(--coral); }
      .calday.sel .caldot { background: var(--white); }
      .calmark { font-size: 10px; line-height: 1; color: var(--muted); font-weight: 700; }
      .calday.sel .calmark { color: var(--white); }
      .calmarks { display: flex; align-items: center; gap: 2px; min-height: 7px; }
      .callegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
      .callbl { display: block; max-width: 100%; font-size: 10px; line-height: 1.2; font-weight: 700; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .callbl.tm { font-weight: 600; opacity: .85; }
      /* ホームの予定表: Google カレンダー風の Box 表示 */
      .calday.boxed { align-items: stretch; padding: 4px 2px 3px; min-height: 48px; }
      .calday.boxed.sel { background: var(--soft); color: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
      .cbox { display: block; width: 100%; box-sizing: border-box; border-radius: 4px; padding: 1px 4px; margin-top: 2px; font-size: 10.5px; line-height: 1.3; font-weight: 600; text-align: left; color: var(--white); background: var(--primary); white-space: normal; word-break: break-all; }
      .cbox.of { background: #d99a2b; } .cbox.rq { background: var(--danger); } .cbox.dn { background: var(--muted); }
      .cbox.ws { background: var(--green); } .cbox.ev { background: var(--coral); }
      .cbox.to { background: var(--taken); color: var(--muted); } .cbox.ng { background: var(--taken); color: var(--muted); font-weight: 500; }
      .cgrp { display: block; width: 100%; box-sizing: border-box; border-left: 3px solid var(--ink); padding-left: 3px; margin-top: 2px; }
      .cgrp .cbox { margin-top: 1px; } .cgrp .cbox:first-child { margin-top: 0; }
      .callegend .cbox { display: inline-block; width: auto; margin: 0; padding: 0 6px; }
      .calgrid > * { min-width: 0; } .calday { max-width: 100%; overflow: hidden; }
      @media (max-width: 640px) { .cbox { font-size: 9.5px; padding: 1px 2px; } }
      .callbl.of { color: var(--amber); } .callbl.dn { color: var(--muted); } .callbl.ev { color: var(--coral); font-weight: 600; } .callbl.more { color: var(--muted); font-weight: 500; }
      .calday.sel .callbl { color: var(--white); }
      .callegend span { display: inline-flex; align-items: center; gap: 4px; }
      .loglist { font-size: 13px; color: var(--muted); }
      .loglist div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
      .loglist div:last-child { border-bottom: none; }
      details.add { margin-top: 10px; }
      details.add summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 13.5px; list-style: none; }
      details.add summary::before { content: "＋ "; }
      details.add[open] summary::before { content: "－ "; }
      details.add .card { margin-top: 8px; }
      .lc-label { display:block; font-size:13px; font-weight:600; margin:14px 0 5px; }
      .lc-text { white-space:pre-wrap; overflow-wrap:anywhere; }
      .lc-notice { background:var(--amber-soft); padding:12px; border-radius:10px; margin-top:12px; }
      .lc-overdue { color:var(--danger); }
      .lc-homework { display:grid; gap:6px; border-top:1px solid var(--line); margin-top:12px; padding-top:12px; }
      .lc-homework>input { width:100%; }
      .lc-history { max-height:340px; overflow:auto; }
      @media(max-width:400px) { .grid2 { grid-template-columns:minmax(0,1fr); } }
      .wrap:has(.lesson-pair-grid) { max-width: 1500px; }
      .lesson-pair-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; align-items:start; }
      .lesson-pair-pane { min-width:0; border-top:5px solid var(--primary); padding-top:8px; }
      .lesson-pair-pane:nth-child(2) { border-top-color:#92712b; }
      .lesson-pair-pane .grid2 { grid-template-columns:1fr; }
      .lesson-pair-pane .head { position:sticky; top:64px; background:var(--bg,#f6f8fb); z-index:2; padding:8px; }
      @media(max-width:900px) { .lesson-pair-grid { grid-template-columns:1fr; } .lesson-pair-pane .head { position:static; } }
    </style>

  <body>
    <div class="top"><div class="in">
      <span class="brand">ステップワイズ 管理<small>英数教室・個別指導部</small></span>
      <nav id="nav"></nav>
    </div></div>
    <div class="wrap" id="app"><div class="loading"><div class="spinner"></div>読み込んでいます…</div></div>
    <div id="toast" role="status"></div>

    <script src="../assets/learning-services.js?v=20260909-ui"></script>
    <script>
      (function () {
        "use strict";
        var API = "https://script.google.com/macros/s/AKfycbz53sl4GgKNY1UY1gaBndjDplQk5MrA9EfShYfy05Jl4JNEFEl7-B1uKSmd0v5Mhn4Irw/exec";
        var YOYAKU = "../yoyaku/";
        var app = document.getElementById("app");
        var nav = document.getElementById("nav");
        var WD = ["日","月","火","水","木","金","土"];
        var LESSON_SUBJECTS = ["英語", "数学", "英数", "国語", "理科", "化学", "社会"];
        var SUBJECT_COLOR = { "英語": "#3556c8", "数学": "#a86f12", "国語": "#7a4fc9", "理科": "#2e8b57", "化学": "#087e8b", "社会": "#b8466f", "5教科": "#19212a", "3教科": "#6b7280" };
        var FALLBACK_COLORS = ["#6b7280", "#4b5563"];
        var D = null;      // ダッシュボード
        var cur = null;    // 表示中の生徒カルテ
        var busy = false;
        var authM = null;  // null=未確認 / 'login' / 'ok'
        var gradeMode = "score", examMode = "dev";
        var editProfile = false;
        var editEmail = false, editFee = false;
        var notificationNotice = "";
        var studentMail = null;

        function studentMailLoad(notificationId) {
          if (!cur || (studentMail && studentMail.busy)) return;
          var s = cur.id, auth = token(), seq = studentMail ? studentMail.seq + 1 : 1;
          studentMail = { id: s, auth: auth, seq: seq, busy: true, data: null, error: "", confirm: null }; render();
          admin(notificationId ? "studentEmailRetryNotification" : "studentEmailNotifications", { studentId: s, notificationId: notificationId || "" }).then(function (res) {
            if (!studentMail || studentMail.seq !== seq || auth !== token() || studentMail.id !== s) return;
            studentMail.busy = false; studentMail.data = res; if (res.notificationWarning) studentMail.error = res.notificationWarning; render();
          }).catch(function (er) { if (!studentMail || studentMail.seq !== seq || auth !== token()) return; studentMail.busy = false; studentMail.error = er.message; render(); });
        }
        function studentMailHtml(s) {
          var status = s.emailStatus || {}, m = studentMail && studentMail.id === s.id && studentMail.auth === token() ? studentMail : null;
          var h = '<p class="small">' + (status.verified ? '受信確認済み：授業の案内・変更・取消を通知します。' : '受信未確認：生徒ページの「メール通知」で本人が登録・確認すると通知が始まります。') + (status.pendingEmail ? ' 確認待ち：' + esc(status.pendingEmail) : '') + '</p><button class="btn-quiet btn-sm" data-action="sm-load"' + (m && m.busy ? ' disabled' : '') + '>生徒メールの送信状況</button>';
          if (!m) return h; if (m.error) h += '<p role="alert">' + esc(m.error) + '</p>'; if (m.busy) return h + '<p>確認中…</p>';
          if (m.confirm) h += '<div class="lc-notice">現在の確認済み連絡先 ' + esc((m.data.emailStatus || {}).email || '') + ' へ再送信します。<button class="btn-primary btn-sm" data-action="sm-send">確認して再送信</button> <button class="btn-quiet btn-sm" data-action="sm-cancel">やめる</button></div>';
          var labels = { sent: '送信済み', pending: '送信待ち', failed: '送信失敗', uncertain: '送信結果不明', suppressed: '送信省略', cancelled: '送信取消' }, kinds = { verify: 'メール受信確認', offered: '授業案内', changed: '授業変更', cancelled: '授業取消', cancelDeclined: '取消依頼への回答' };
          var items = m.data && m.data.notifications || [];
          if (!items.length) h += '<p class="note">送信履歴はありません。</p>';
          items.forEach(function (n) { h += '<div class="line"><span class="w">' + esc(kinds[n.kind] || '授業の連絡') + '・' + esc(fmtAuthTime(n.createdAt)) + '<div class="small">' + esc(labels[n.status] || n.status) + (n.error ? '：' + esc(n.error) : '') + '</div></span>' + (n.retryable ? '<button class="btn-quiet btn-sm" data-action="sm-retry" data-id="' + esc(n.id) + '">再送信を確認</button>' : '') + '</div>'; });
          return h + '<p class="note">結果不明のメールは重複を避けるため再送信しません。確認メールは生徒ページから再発行できます。</p>';
        }

        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
        function token() { return lsGet("sw_admt") || ""; }
        function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
        function pad(n) { return String(n).length < 2 ? "0" + n : String(n); }
        function wdOf(ds) { var p = ds.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
        function fmtD(ds) { if (!ds || ds.length < 10) return esc(ds || ""); var p = ds.split("-"); return (+p[1]) + "/" + (+p[2]) + "(" + WD[wdOf(ds)] + ")"; }
        function fmtDY(ds) { if (!ds || ds.length < 10) return esc(ds || ""); var p = ds.split("-"); return p[0] + "/" + (+p[1]) + "/" + (+p[2]); }
        function endTime(start, min) { var p = start.split(":"); var t = (+p[0]) * 60 + (+p[1]) + (+min); return pad(Math.floor(t / 60) % 24) + ":" + pad(t % 60); }
        function yen(n) { return (Number(n) || 0).toLocaleString() + "円"; }
        function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
        function taskDueText(t) { if (t.dueMode === "nextLesson") return '次の' + esc(t.dueSubject || '同じ科目') + '授業：' + (t.due ? fmtDY(t.due) + (t.dueStart ? ' ' + esc(t.dueStart) : '') : '予定未定'); return t.due ? fmtDY(t.due) : '期限なし'; }
        function deadlineOptions(mode) { return [{v:'nextLesson',t:'次の同じ科目の授業'}, {v:'date',t:'日付を指定'}, {v:'none',t:'期限なし'}].map(function (x) { return '<option value="' + x.v + '"' + (mode === x.v ? ' selected' : '') + '>' + x.t + '</option>'; }).join(''); }
        function taskDeadlineInputs(subject) { return '<label>期限<select id="tk-due-mode">' + deadlineOptions('nextLesson') + '</select></label><label>次回授業の科目<select id="tk-due-subject">' + [''].concat(LESSON_SUBJECTS).map(function (s) { return '<option value="' + esc(s) + '"' + (s === subject ? ' selected' : '') + '>' + esc(s || '選択してください') + '</option>'; }).join('') + '</select></label><label>指定日<input type="date" id="tk-due" disabled></label>'; }
        document.addEventListener('change', function (ev) { if (ev.target.id !== 'tk-due-mode') return; document.getElementById('tk-due').disabled = ev.target.value !== 'date'; document.getElementById('tk-due-subject').disabled = ev.target.value !== 'nextLesson'; });
        function thisYm() { return today().slice(0, 7); }
        var toastTimer = null;
        function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800); }
        function val(id) { var el = document.getElementById(id); return el ? String(el.value || "").trim() : ""; }
        function halfDigits(s) { return String(s || "").replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).trim(); }
        function fmtAuthTime(v) { var d = new Date(v); return !v || isNaN(d.getTime()) ? "—" : d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); }

        /* ---------- 成績グラフ(SVG) ---------- */
        function colorFor(subject, idx) { return SUBJECT_COLOR[subject] || FALLBACK_COLORS[idx % FALLBACK_COLORS.length]; }
        function gradeChart(grades, mode) {
          var pts = grades.filter(function (g) { return mode === "dev" ? (g.dev !== null && !isNaN(g.dev)) : !isNaN(g.score); });
          if (pts.length < 2) return '<div class="empty">記録が2件以上たまるとグラフが表示されます</div>';
          var dates = []; pts.forEach(function (g) { if (dates.indexOf(g.date) < 0) dates.push(g.date); }); dates.sort();
          var subjects = []; pts.forEach(function (g) { var s = g.subject || "その他"; if (subjects.indexOf(s) < 0) subjects.push(s); });
          var W = 640, H = 260, L = 44, R = 90, T = 16, B = 40;
          var iw = W - L - R, ih = H - T - B;
          var vals = pts.map(function (g) { return mode === "dev" ? g.dev : g.score; });
          var ymax = Math.max.apply(null, vals.concat(mode === "dev" ? [70] : pts.map(function (g) { return g.max || 100; })));
          var ymin = mode === "dev" ? Math.min(30, Math.min.apply(null, vals)) : 0;
          ymax = Math.ceil(ymax / 10) * 10; ymin = Math.floor(ymin / 10) * 10;
          var xOf = function (d) { var i = dates.indexOf(d); return dates.length === 1 ? L + iw / 2 : L + i * iw / (dates.length - 1); };
          var yOf = function (v) { return T + ih - (v - ymin) / (ymax - ymin || 1) * ih; };
          var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="成績推移">';
          var steps = 4;
          for (var i = 0; i <= steps; i++) {
            var v = ymin + (ymax - ymin) * i / steps; var y = yOf(v);
            svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#e5e9ee" stroke-width="1"/>';
            svg += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#64717f">' + Math.round(v) + '</text>';
          }
          var lblEvery = Math.ceil(dates.length / 6);
          dates.forEach(function (d, i) { if (i % lblEvery === 0 || i === dates.length - 1) svg += '<text x="' + xOf(d) + '" y="' + (H - 14) + '" text-anchor="middle" font-size="11" fill="#64717f">' + fmtDY(d).slice(5) + '</text>'; });
          var endLbls = [];
          subjects.forEach(function (sub, si) {
            var col = colorFor(sub, si);
            var mine = pts.filter(function (g) { return (g.subject || "その他") === sub; });
            var path = mine.map(function (g, i) { return (i ? "L" : "M") + xOf(g.date).toFixed(1) + " " + yOf(mode === "dev" ? g.dev : g.score).toFixed(1); }).join(" ");
            svg += '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
            mine.forEach(function (g) {
              var v = mode === "dev" ? g.dev : g.score;
              svg += '<circle cx="' + xOf(g.date) + '" cy="' + yOf(v) + '" r="4.5" fill="' + col + '" stroke="#fff" stroke-width="2"><title>' + esc(fmtDY(g.date) + " " + (g.test || "") + " " + sub + " " + v + (mode === "dev" ? "" : (g.max ? "/" + g.max : ""))) + '</title></circle>';
            });
            var last = mine[mine.length - 1];
            endLbls.push({ x: xOf(last.date) + 8, y: yOf(mode === "dev" ? last.dev : last.score) + 4, text: esc(sub) + ' ' + (mode === "dev" ? last.dev : last.score) });
          });
          // 右端ラベルは上下に13px以上あけて重ならないように並べる
          endLbls.sort(function (a, b) { return a.y - b.y; });
          for (var li = 1; li < endLbls.length; li++) if (endLbls[li].y - endLbls[li - 1].y < 13) endLbls[li].y = endLbls[li - 1].y + 13;
          for (var lj = endLbls.length - 1; lj >= 0; lj--) { var lim = (lj === endLbls.length - 1) ? T + ih + 4 : endLbls[lj + 1].y - 13; if (endLbls[lj].y > lim) endLbls[lj].y = lim; }
          endLbls.forEach(function (l) { svg += '<text x="' + l.x + '" y="' + l.y.toFixed(1) + '" font-size="11.5" font-weight="700" fill="#19212a">' + l.text + '</text>'; });
          svg += '</svg>';
          if (subjects.length >= 2) {
            svg += '<div class="legend">' + subjects.map(function (s, i) { return '<span><i style="background:' + colorFor(s, i) + '"></i>' + esc(s) + '</span>'; }).join("") + '</div>';
          }
          return svg;
