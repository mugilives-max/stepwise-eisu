<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>マイページ | ステップワイズ英数教室・個別指導部</title>
    <meta name="description" content="ステップワイズ個別指導 生徒のマイページ。授業の予定表、先生からの案内、希望日程の送信ができます。" />
    <style>
      :root {
        --ink: #19212a; --muted: #64717f; --line: #dbe3ea; --paper: #fbfcfd; --soft: #eef4fb;
        --primary: #0717a8; --primary-dark: #07106f; --coral: #d86f8d; --coral-soft: #fbeef2;
        --amber: #a86f12; --amber-soft: #fdf3e3; --green: #2e8b57; --green-soft: #e6f4ec;
        --danger: #c0392b; --danger-soft: #fbe9e7; --taken: #eef1f4; --white: #ffffff;
        --shadow: 0 10px 30px rgba(31, 48, 64, 0.1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { background: var(--paper); color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; font-size: 15px; line-height: 1.7; padding-bottom: 120px; }
      .site-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px clamp(16px, 4vw, 40px); background: rgba(251, 252, 253, 0.92); border-bottom: 1px solid var(--line); }
      .brand { font-weight: 700; line-height: 1.25; font-size: 15px; }
      .brand small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
      .site-header a { color: var(--muted); font-size: 13px; text-decoration: none; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
      h1 { font-size: 21px; margin: 22px 0 2px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      h2 { font-size: 15px; font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      h2 .cnt { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
      select, input[type="text"], input[type="password"], input[type="date"], input[type="time"], input[type="number"] { font: inherit; color: var(--ink); background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
      select:focus, input:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
      button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
      button:disabled { opacity: 0.55; cursor: default; }
      .btn-primary { background: var(--primary); color: var(--white); }
      .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
      .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      .small { font-size: 12.5px; }
      .muted { color: var(--muted); }
      /* 予定表 */
      .cal { padding: 12px 12px 10px; }
      .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .callabel { font-weight: 700; font-size: 15px; }
      .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
      .calwd { font-size: 11px; color: var(--muted); padding: 2px 0; }
      .calwd.sun { color: var(--danger); } .calwd.sat { color: var(--primary); }
      .calday { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px; padding: 4px 0 3px; min-height: 42px; max-width: 100%; overflow: hidden; border-radius: 9px; border: 1px solid transparent; background: transparent; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
      button.calday { cursor: pointer; font-size: 13px; }
      .calday.sun { color: var(--danger); } .calday.sat { color: var(--primary); }
      .calday.off { opacity: 0.35; }
      .calday.today { border-color: var(--muted); }
      .calday.mine:not(.sel) { background: var(--coral-soft); }
      .calday.sel { background: var(--primary); color: var(--white); border-color: var(--primary); }
      .calday.selday { border: 1px dashed var(--danger); background: var(--danger-soft); }
      .calday.selday.wish { border-color: var(--green); background: var(--green-soft); }
      .calday.selday.event { border-color: var(--coral); background: var(--coral-soft); }
      .calday.selday .calmark { color: var(--danger); }
      .selbar { border-top: 3px solid var(--danger); }
      .selbar.wish { border-top-color: var(--green); }
      .selbar.event { border-top-color: var(--coral); }
      .caldot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
      .caldot.of { background: #d99a2b; }
      .calday.sel .caldot { background: var(--white); }
      .calmark { font-size: 10px; line-height: 1; color: var(--muted); font-weight: 700; }
      .calday.sel .calmark { color: var(--white); }
      .calmarks { display: flex; align-items: center; gap: 2px; min-height: 7px; }
      .callbl { display: block; max-width: 100%; font-size: 10px; line-height: 1.2; font-weight: 700; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .callbl.tm { font-weight: 600; opacity: .85; }
      .callbl.of { color: var(--amber); }
      .callbl.dn { color: var(--muted); }
      .callbl.ev { color: var(--coral); font-weight: 600; }
      .callbl.more { color: var(--muted); font-weight: 500; }
      .calday.sel .callbl { color: var(--white); }
      .callegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
      .callegend span { display: inline-flex; align-items: center; gap: 4px; }
      /* チップ・行 */
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { font-variant-numeric: tabular-nums; border-radius: 10px; padding: 8px 12px; font-size: 14px; border: 1px solid var(--line); background: var(--white); display: inline-flex; align-items: center; gap: 6px; }
      button.chip { cursor: pointer; font-weight: 600; }
      .chip.mine { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); font-weight: 700; }
      .chip.offer { background: var(--amber-soft); border-color: #d99a2b; color: var(--amber); font-weight: 700; }
      .chip.done { background: var(--taken); border-color: var(--line); color: var(--muted); font-weight: 600; }
      .chip.past { background: transparent; border-color: var(--line); color: var(--muted); font-weight: 600; }
      .chip.ev { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); font-weight: 600; }
      .chip.ng { background: var(--taken); border-color: var(--line); color: var(--muted); }
      .empty { color: var(--muted); font-size: 13.5px; padding: 8px 2px; }
      .slotline { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .slotline:last-child { border-bottom: none; }
      .slotline .time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 104px; }
      .slotline .who { flex: 1; min-width: 80px; }
      .tag { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; font-weight: 700; white-space: nowrap; }
      .tag.blue { background: var(--soft); color: var(--primary); }
      .tag.amber { background: var(--amber-soft); color: var(--amber); }
      .tag.green { background: var(--green-soft); color: var(--green); }
      .tag.gray { background: var(--taken); color: var(--muted); }
      .tag.red { background: var(--danger-soft); color: var(--danger); }
      .tag.coral { background: var(--coral-soft); color: var(--coral); }
      .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
      /* 次の授業 */
      .next { border-color: var(--primary); background: linear-gradient(180deg, #fff, var(--soft)); }
      .next .when { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
      .next .in { color: var(--primary); font-size: 12.5px; font-weight: 600; }
      /* 操作ボタン */
      .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .actions button { padding: 12px 6px; border-radius: 12px; background: var(--white); border: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1.3; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .actions button .ico { font-size: 18px; line-height: 1; }
      .actions button.on { border-color: var(--primary); background: var(--soft); color: var(--primary); }
      .panel { margin-top: 10px; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
      .seg button { border: none; border-radius: 0; background: transparent; color: var(--muted); padding: 6px 12px; font-size: 13px; }
      .seg button.on { background: var(--soft); color: var(--primary); font-weight: 700; }
      details.month { margin-top: 8px; }
      details.month summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; padding: 6px 0; }
      details.month summary::before { content: "▸ "; color: var(--muted); }
      details.month[open] summary::before { content: "▾ "; }
      /* 保護者 */
      .stat { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
      .stat small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
      table.tb { border-collapse: collapse; width: 100%; font-size: 13.5px; }
      table.tb th, table.tb td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
      table.tb th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .tbwrap { overflow-x: auto; }
      .chart { width: 100%; height: auto; display: block; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
      .legend span { display: inline-flex; align-items: center; gap: 5px; }
      .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .parentbar { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .parentbar button { background: transparent; color: var(--paper); border: 1px solid rgba(255,255,255,.5); }
      /* 下部バー・トースト */
      .confirmbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--white); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(31, 48, 64, 0.12); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
      .confirmbar .inner { max-width: 640px; margin: 0 auto; }
      .confirmbar .msg { font-weight: 700; margin-bottom: 10px; }
      #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 30; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 9px 18px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 88vw; }
      #toast.show { opacity: 1; }
      .loading { text-align: center; color: var(--muted); padding: 60px 0; }
      .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } #toast { transition: none; } }
      footer.app { margin-top: 44px; padding: 16px 0 24px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12.5px; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="brand">ステップワイズ個別指導<small>英数教室・個別指導部</small></span>
      <a href="../">トップページへ</a>
    </header>
    <div class="wrap" id="app">
      <div class="loading"><div class="spinner"></div>読み込んでいます…</div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        "use strict";
        var API = "https://script.google.com/macros/s/AKfycbz53sl4GgKNY1UY1gaBndjDplQk5MrA9EfShYfy05Jl4JNEFEl7-B1uKSmd0v5Mhn4Irw/exec";
        var app = document.getElementById("app");
        var WD = ["日", "月", "火", "水", "木", "金", "土"];
        var SUBJECT_COLOR = { "英語": "#3556c8", "数学": "#a86f12", "国語": "#7a4fc9", "理科": "#2e8b57", "社会": "#b8466f" };

        /* ---------- 状態 ---------- */
        var S = null;            // 生徒の状態(サーバーから)
        var busy = false;
        var pending = null;      // 確認バー {kind, slotId}
        var selDate = null, selManual = false;
        var calNow = new Date(), calY = calNow.getFullYear(), calM = calNow.getMonth();
        var panel = "";          // "" | "wish" | "event" | "ng"
        var wishKind = "want";   // want=この日時 / ok=この時間帯のどこかで
        var selMode = "", selDays = {}; // 予定表で日付を選択中のモード("" | "ng" | "wish" | "event") と選んだ日付
        var previewK = null;     // 先生のプレビュー
        var parentStep = "";     // "" | "pass" | "data"
        var P = null;            // 保護者向けデータ
        var gradeMode = "score";

        /* ---------- ユーティリティ ---------- */
        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
        function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
        function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
        function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
        function pad(n) { return (n < 10 ? "0" : "") + n; }
        function wdOf(ds) { var p = ds.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
        function fmtDate(ds) { var p = ds.split("-"); return (+p[1]) + "/" + (+p[2]); }
        function fmtDateW(ds) { return fmtDate(ds) + "(" + WD[wdOf(ds)] + ")"; }
        function fmtDY(ds) { if (!ds || ds.length < 10) return esc(ds || ""); var p = ds.split("-"); return p[0] + "/" + (+p[1]) + "/" + (+p[2]); }
        function endTime(start, min) { var p = start.split(":"); var t = (+p[0]) * 60 + (+p[1]) + (+min); return pad(Math.floor(t / 60) % 24) + ":" + pad(t % 60); }
        function addDaysStr(ds, n) { var p = ds.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
        function yen(n) { return (Number(n) || 0).toLocaleString() + "円"; }
        function gcalUrl(s) {
          var d = s.date.replace(/-/g, ""), st = s.start.replace(":", ""), en = endTime(s.start, s.min).replace(":", "");
          var u = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("塾の授業" + (s.subject ? "(" + s.subject + ")" : "(ステップワイズ)")) +
            "&dates=" + d + "T" + st + "00/" + d + "T" + en + "00&ctz=Asia/Tokyo";
          if (s.meet) u += "&details=" + encodeURIComponent("Meetで参加: " + s.meet);
          return u;
        }
        function groupBlocked(list) {
          var sorted = list.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
          var groups = [], cur = null;
          sorted.forEach(function (b) {
            if (cur && String(b.note || "") === cur.note && b.date === addDaysStr(cur.end, 1)) { cur.end = b.date; cur.ids.push(b.id); }
            else { cur = { start: b.date, end: b.date, note: String(b.note || ""), ids: [b.id] }; groups.push(cur); }
          });
          return groups;
        }
        function rangeLabel(g) { return g.start === g.end ? fmtDateW(g.start) : fmtDateW(g.start) + "〜" + fmtDateW(g.end); }
        // 日付の配列を連続する期間にまとめる → [{date, dateTo}]
        function groupDays(dates) {
          var out = [], cur = null;
          dates.slice().sort().forEach(function (d) {
            if (cur && d === addDaysStr(cur.dateTo, 1)) cur.dateTo = d;
            else { cur = { date: d, dateTo: d }; out.push(cur); }
          });
          return out;
        }
        function sameId(a, b) { return String(a) === String(b); }
        function slotCmp(a, b) { return a.date === b.date ? (a.start < b.start ? -1 : 1) : (a.date < b.date ? -1 : 1); }
        var toastTimer = null;
        function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800); }
        function val(id) { var el = document.getElementById(id); return el ? String(el.value || "").trim() : ""; }

        /* ---------- API ---------- */
        function apiGet(params) {
          var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
          return fetch(API + "?" + q).then(function (r) { return r.json(); });
        }
        function apiPost(body) { return fetch(API, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
        function myKey() { return previewK || lsGet("sw_k") || ""; }
        function loadState() {
          return apiGet({ action: "state", k: myKey() }).then(function (res) {
            if (res.error) throw new Error(res.error);
            S = res; render();
          });
        }
        function studentAction(body, okMsg) {
          if (busy) return;
          busy = true; render();
          apiPost(body).then(function (res) {
            busy = false; pending = null;
            if (res.error) {
              toast(res.error);
              if (res.badCode) { S = { me: null, slots: [], today: "" }; render(); return; }
              if (res.refresh) return loadState();
              render(); return;
            }
            S = res.state; render();
            if (okMsg) toast(okMsg);
          }).catch(function () { busy = false; toast("通信に失敗しました。電波の良いところでもう一度お試しください"); render(); });
        }

        /* ---------- 予定表 ---------- */
        function renderCal(info, today) {
          var label = calY + "年" + (calM + 1) + "月";
          var minIdx = calNow.getFullYear() * 12 + calNow.getMonth() - 2, curIdx = calY * 12 + calM, maxIdx = minIdx + 5;
          var h = '<div class="card cal"><div class="calhead">';
          h += '<button class="btn-quiet btn-sm" data-action="calprev"' + (curIdx <= minIdx ? " disabled" : "") + ' aria-label="前の月">◀</button>';
          h += '<span class="callabel">' + label + "</span>";
          h += '<button class="btn-quiet btn-sm" data-action="calnext"' + (curIdx >= maxIdx ? " disabled" : "") + ' aria-label="次の月">▶</button>';
          h += '</div><div class="calgrid">';
          WD.forEach(function (w, i) { h += '<span class="calwd' + (i === 0 ? " sun" : i === 6 ? " sat" : "") + '">' + w + "</span>"; });
          var startWd = new Date(calY, calM, 1).getDay();
          for (var i = 0; i < startWd; i++) h += "<span></span>";
          var days = new Date(calY, calM + 1, 0).getDate();
          for (var d = 1; d <= days; d++) {
            var ds = calY + "-" + pad(calM + 1) + "-" + pad(d);
            var it = info[ds], wd = (startWd + d - 1) % 7, cls = "calday", past = ds < today;
            if (wd === 0) cls += " sun"; if (wd === 6) cls += " sat";
            if (ds === today) cls += " today"; if (ds === selDate) cls += " sel";
            var hasItems = !!(it && it.labels && it.labels.length);
            var marks = '<span class="calmarks">';
            if (it && !past) {
              if (it.mine) cls += " mine";
              if (it.offer && !it.mine) marks += '<span class="caldot of"></span>';
              if (it.ng) marks += '<span class="calmark">×</span>';
            }
            if (selMode && selDays[ds] && !past) { cls += " selday " + selMode; if (selMode === "ng" && !(it && it.ng)) marks += '<span class="calmark" style="color:var(--danger)">×</span>'; }
            marks += "</span>";
            if (hasItems) {
              var lb = it.labels.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
              lb.slice(0, 2).forEach(function (l) {
                if (l.st === "event") { marks += '<span class="callbl ev">' + esc(l.text) + "</span>"; return; }
                var lc = l.st === "offer" ? " of" : (l.st === "done" || l.st === "past") ? " dn" : "";
                marks += '<span class="callbl tm' + lc + '">' + esc(l.start) + '</span><span class="callbl' + lc + '">' + esc(l.text) + "</span>";
              });
              if (lb.length > 2) marks += '<span class="callbl more">+' + (lb.length - 2) + "</span>";
            }
            var clickable = (!past && (it || selMode)) || (past && hasItems);
            if (!clickable) h += '<span class="' + cls + (past && hasItems ? "" : " off") + '">' + d + marks + "</span>";
            else h += '<button class="' + cls + '" data-action="calday" data-date="' + ds + '">' + d + marks + "</button>";
          }
          h += '</div><div class="callegend">';
          h += '<span><span class="callbl" style="display:inline">科目</span> 授業(確定)</span>';
          h += '<span><span class="callbl of" style="display:inline">科目</span> 先生からの案内</span>';
          h += '<span><span class="callbl dn" style="display:inline">科目</span> 実施済み</span>';

        /* ---------- 画面: 専用リンクなし ---------- */

            '<footer class="app"><span></span><span></span></footer>';

        /* ---------- 画面: 生徒のマイページ ---------- */
        function renderStudent() {
          if (!S || !S.me) { renderGuard(); return; }
          if (parentStep === "data" && P) { renderParent(); return; }
          var today = S.today;
          var now = new Date();

          var offers = slots.filter(function (s) { return s.st === "offer"; });

          var blocked = S.blocked || [];

          }

          // 見出し + 今月の授業
          html += '<h1>' + esc(S.me.name) + 'さんのページ</h1><p class="sub">授業の予定表と、先生とのやりとり</p>';
          (function () {
            var ym = today.slice(0, 7);
            var histM = (S.history || []).filter(function (h) { return h.date.slice(0, 7) === ym; });
            var doneM = histM.filter(function (h) { return h.done; });
            var planM = mine.filter(function (s) { return s.date.slice(0, 7) === ym; }).concat(histM.filter(function (h) { return !h.done; }));
            var bySub = {}, order = [];
            doneM.concat(planM).forEach(function (x) { var k = x.subject || "その他"; if (!bySub[k]) { bySub[k] = { done: 0, plan: 0 }; order.push(k); } });
            doneM.forEach(function (x) { bySub[x.subject || "その他"].done++; });
            planM.forEach(function (x) { bySub[x.subject || "その他"].plan++; });
            if (!order.length) return;
            html += '<div class="card" style="margin-top:12px;padding:10px 14px"><div class="small muted" style="margin-bottom:2px">' + (+ym.slice(5)) + '月の授業</div><div class="row" style="gap:8px 18px">';
            order.forEach(function (k) { var b = bySub[k]; html += '<span><strong>' + esc(k) + '</strong> <span style="font-variant-numeric:tabular-nums">' + (b.done + b.plan) + '回</span><span class="small muted">(実施 ' + b.done + '・予定 ' + b.plan + ')</span></span>'; });
            html += '</div></div>';

          // 予定表(最上部)

          evDays.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
          function hasVisible(d) { return (byDate[d] || []).some(function (s) { return s.st === "offer" || s.st === "mine"; }); }
          if (selDate === null || (!selManual && !hasVisible(selDate))) {
            var found = null;

            var it = info[s.date] || (info[s.date] = { offer: 0, mine: 0, ng: 0, past: 0, ev: 0, labels: [] });
            if (s.st === "done" || s.st === "past") it.past++; else if (s.st === "event") it.ev++; else it[s.st]++;
            it.labels.push({ text: s.subject || (s.st === "event" ? "予定" : "授業"), st: s.st, start: s.start });

          html += '<h2>予定表' + (selMode ? ' <span style="font-size:12.5px;color:var(--' + (selMode === "ng" ? "danger" : selMode === "wish" ? "green" : "coral") + ');font-weight:600">' + hintMap[selMode] + '</span>' : "") + '</h2>';

          // 今後の予定

          if (upcoming.length > 1 || (upcoming.length === 1 && !next)) {

            upcoming.forEach(function (s) {

            });

          } else if (upcoming.length === 1) {
            html += '<div class="empty">上の「次の授業」の1件だけです</div>';
          } else {

          }
          html += '<div class="note">確定した授業の取消は先生への依頼制です(授業の' + (S.cancelDeadlineH || 24) + '時間前まで)。直前の変更はLINEで直接連絡してください。</div>';

          // 先生に伝える(操作コーナー)
          html += '<h2>先生に伝える</h2><div class="actions">';
          html += '<button data-action="panel" data-p="wish" class="' + (panel === "wish" ? "on" : "") + '"><span class="ico">🗓</span>授業の希望</button>';
          html += '<button data-action="panel" data-p="event" class="' + (panel === "event" ? "on" : "") + '"><span class="ico">📌</span>予定を共有</button>';
          html += '<button data-action="panel" data-p="ng" class="' + (panel === "ng" ? "on" : "") + '"><span class="ico">✕</span>授業できない日</button>';
          html += '</div><div class="note">ボタンを押すと予定表で日付をタップして選べます。日付を選んだら、画面下の内容を確認して送ってください。</div>';
          if (panel === "wish") html += renderWishPanel(today);
          if (panel === "event") html += renderEventPanel(today, events);
          if (panel === "ng") html += renderNgPanel(today, blocked);

          // これまでの授業
          var done = (S.history || []).filter(function (h) { return h.done; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
          html += '<h2>これまでの授業 <span class="cnt">直近' + done.length + '回</span></h2>';
          if (!done.length) html += '<div class="empty">実施済みの授業はまだありません</div>';
          else {

            html += '<div class="card">';
            mk.forEach(function (m, i) {

              list.forEach(function (h) { html += '<div class="slotline"><span class="time">' + fmtDateW(h.date) + " " + h.start + '</span><span class="who">' + (h.subject ? esc(h.subject) : '<span class="muted">科目なし</span>') + ' <span class="small muted">' + h.min + '分</span></span></div>'; });
              html += '</details>';

          html += '<div class="card"><div class="row"><input type="password" id="f-ppass" placeholder="パスワード" autocomplete="off" style="flex:1;min-width:160px"><button class="btn-primary btn-sm" data-action="parentopen"' + (busy ? " disabled" : "") + '>' + (busy ? "確認中…" : "開く") + '</button></div></div>';

              var addN = selDates.filter(function (d) { return !ngByDate[d]; }).length, remN = selDates.length - addN;
              html += '<div class="msg">授業できない日: ' + selDates.length + '日' + (selDates.length ? '(登録 ' + addN + '日' + (remN ? '・解除 ' + remN + '日' : '') + ')' : '') + '</div>';
              html += '<div class="small muted" style="margin-bottom:8px">' + selTxt + (selDates.length ? "" : "。×が付いている日をタップすると解除") + '</div>';

        function cancelControl(s) {

        function renderWishPanel(today) {

          h += '<div class="row" style="margin-bottom:8px"><button class="btn-primary btn-sm" data-action="selstart" data-m="wish">予定表で日を選ぶ</button><span class="small muted">授業をしてほしい日をタップ。時間は画面下で入力します。</span></div>';
          h += '<details><summary style="cursor:pointer;color:var(--primary);font-size:13.5px">日付を入力して送る</summary><div style="margin-top:8px">';
          h += '<div class="row" style="margin-bottom:8px"><span class="seg"><button data-action="wkind" data-k="want" class="' + (wishKind === "want" ? "on" : "") + '">この日時に授業をしたい</button><button data-action="wkind" data-k="ok" class="' + (wishKind === "ok" ? "on" : "") + '">この時間帯のどこかで</button></span></div>';
          if (wishKind === "want") {
            h += '<div class="row"><input type="date" id="f-wdate" min="' + today + '"><input type="time" id="f-wstart" value="17:00" step="900"><select id="f-wmin"><option value="60">60分</option><option value="90" selected>90分</option><option value="120">120分</option></select><input type="text" id="f-wnote" placeholder="メモ(任意。例: 英語を希望)" maxlength="100" style="flex:1;min-width:140px"><button class="btn-primary btn-sm" data-action="addwish"' + (busy ? " disabled" : "") + '>希望を送る</button></div>';
            h += '<div class="note">「この日のこの時間に授業をしたい」という希望です。先生が確認して案内を送るので、承認すると確定です。</div>';
          } else {
            h += '<div class="row"><input type="date" id="f-wdate" min="' + today + '"><input type="time" id="f-wstart" value="13:00" step="900"><span class="muted">〜</span><input type="time" id="f-wend" value="18:00" step="900"><input type="text" id="f-wnote" placeholder="メモ(任意。例: 英語を希望)" maxlength="100" style="flex:1;min-width:140px"><button class="btn-primary btn-sm" data-action="addwish"' + (busy ? " disabled" : "") + '>時間帯を送る</button></div>';
            h += '<div class="note">「この時間帯なら授業ができる」という空き時間です。先生がこの中から授業の時間を決めて案内します(時間帯すべてが授業になるわけではありません)。</div>';
          }
          h += '</div></details>';
          if (wishes.length) {
            h += '<div style="margin-top:10px">';
            wishes.forEach(function (wv) {
              var isWant = wv.kind === "want";
              h += '<div class="slotline"><span class="time">' + fmtDateW(wv.date) + " " + wv.start + "〜" + wv.end + '</span><span class="who"><span class="tag ' + (isWant ? "blue" : "green") + '">' + (isWant ? "この日時を希望" : "この時間帯のどこかで") + '</span> ' + (wv.note ? esc(wv.note) : "") + ' <span class="small muted">先生の返事待ち</span></span><button class="btn-quiet btn-sm" data-action="delwish" data-id="' + esc(wv.id) + '">取消</button></div>';
            });
            h += '</div>';
          }
          return h + '</div>';
        }

        function renderEventPanel(today, events) {
          var h = '<div class="panel card">';
          h += '<div class="row" style="margin-bottom:8px"><button class="btn-primary btn-sm" data-action="selstart" data-m="event">予定表で日を選ぶ</button><span class="small muted">大会・見学・テスト期間など。連続する日は1つの予定になります。</span></div>';
          h += '<details><summary style="cursor:pointer;color:var(--primary);font-size:13.5px">日付を入力して送る</summary><div style="margin-top:8px">';
          h += '<div class="row"><input type="date" id="f-edate" min="' + today + '"><span class="muted">〜</span><input type="date" id="f-edate2" min="' + today + '"><input type="text" id="f-etitle" placeholder="内容(例: 大会、高校見学、修学旅行)" maxlength="40" style="flex:1;min-width:160px"></div>';
          h += '<div class="row" style="margin-top:8px"><label class="small" style="display:inline-flex;align-items:center;gap:6px"><input type="checkbox" id="f-eblock"> この期間は授業できない日にもする</label><button class="btn-primary btn-sm" data-action="addevent"' + (busy ? " disabled" : "") + '>先生に共有</button></div></div></details>';
          var up = events.filter(function (e) { return e.dateTo >= today; });
          if (up.length) {
            h += '<div style="margin-top:10px">';
            up.forEach(function (e) { h += '<div class="slotline"><span class="time">' + (e.date === e.dateTo ? fmtDateW(e.date) : fmtDateW(e.date) + "〜" + fmtDateW(e.dateTo)) + '</span><span class="who">' + esc(e.title) + '</span><button class="btn-quiet btn-sm" data-action="delevent" data-id="' + esc(e.id) + '">取消</button></div>'; });
            h += '</div>';
          }
          return h + '</div>';
        }

        function renderNgPanel(today, blocked) {
          var h = '<div class="panel card">';
          h += '<div class="row"><button class="btn-primary btn-sm" data-action="selstart" data-m="ng">予定表で日を選ぶ</button><span class="small muted">授業ができない日を先生に伝えます。その日には案内が来なくなります。</span></div>';
          h += '<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--primary);font-size:13.5px">期間でまとめて登録する(旅行など連日のとき)</summary>';
          h += '<div class="row" style="margin-top:8px"><input type="date" id="f-bdate" min="' + today + '"><span class="muted">〜</span><input type="date" id="f-bdate2" min="' + today + '"><input type="text" id="f-bnote" placeholder="メモ(任意。例: 修学旅行)" maxlength="50" style="flex:1;min-width:140px"><button class="btn-ghost btn-sm" data-action="addblock"' + (busy ? " disabled" : "") + '>登録</button></div></details>';
          if (blocked.length) {
            h += '<div style="margin-top:10px">';
            groupBlocked(blocked).forEach(function (g) { h += '<div class="slotline"><span class="time">' + rangeLabel(g) + '</span><span class="who">' + (g.note ? esc(g.note) : "") + '</span><button class="btn-quiet btn-sm" data-action="delblock" data-ids="' + esc(g.ids.join(",")) + '">解除</button></div>'; });
            h += '</div>';
          }
          return h + '</div>';
        }

        /* ---------- 画面: 保護者の方へ ---------- */
        function colorFor(subject, idx) { return SUBJECT_COLOR[subject] || ["#6b7280", "#4b5563"][idx % 2]; }
        function gradeChart(grades, mode) {
          var pts = grades.filter(function (g) { return mode === "dev" ? (g.dev !== null && !isNaN(g.dev)) : !isNaN(g.score); });
          if (pts.length < 2) return '<div class="empty">記録が2件以上たまるとグラフが表示されます</div>';
          var dates = []; pts.forEach(function (g) { if (dates.indexOf(g.date) < 0) dates.push(g.date); }); dates.sort();
          var subjects = []; pts.forEach(function (g) { var s = g.subject || "その他"; if (subjects.indexOf(s) < 0) subjects.push(s); });
          var W = 640, H = 260, L = 44, R = 90, T = 16, B = 40, iw = W - L - R, ih = H - T - B;
          var vals = pts.map(function (g) { return mode === "dev" ? g.dev : g.score; });
          var ymax = Math.max.apply(null, vals.concat(mode === "dev" ? [70] : pts.map(function (g) { return g.max || 100; })));
          var ymin = mode === "dev" ? Math.min(30, Math.min.apply(null, vals)) : 0;
          ymax = Math.ceil(ymax / 10) * 10; ymin = Math.floor(ymin / 10) * 10;
          var xOf = function (d) { var i = dates.indexOf(d); return dates.length === 1 ? L + iw / 2 : L + i * iw / (dates.length - 1); };
          var yOf = function (v) { return T + ih - (v - ymin) / (ymax - ymin || 1) * ih; };
          var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="成績推移">';
          for (var i = 0; i <= 4; i++) { var v = ymin + (ymax - ymin) * i / 4, y = yOf(v); svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#e5e9ee"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#64717f">' + Math.round(v) + '</text>'; }
          var every = Math.ceil(dates.length / 6);
          dates.forEach(function (d, i) { if (i % every === 0 || i === dates.length - 1) svg += '<text x="' + xOf(d) + '" y="' + (H - 14) + '" text-anchor="middle" font-size="11" fill="#64717f">' + fmtDY(d).slice(5) + '</text>'; });
          subjects.forEach(function (sub, si) {
            var col = colorFor(sub, si), minePts = pts.filter(function (g) { return (g.subject || "その他") === sub; });
            svg += '<path d="' + minePts.map(function (g, i) { return (i ? "L" : "M") + xOf(g.date).toFixed(1) + " " + yOf(mode === "dev" ? g.dev : g.score).toFixed(1); }).join(" ") + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
            minePts.forEach(function (g) { var v = mode === "dev" ? g.dev : g.score; svg += '<circle cx="' + xOf(g.date) + '" cy="' + yOf(v) + '" r="4.5" fill="' + col + '" stroke="#fff" stroke-width="2"><title>' + esc(fmtDY(g.date) + " " + (g.test || "") + " " + sub + " " + v + (mode === "dev" ? "" : (g.max ? "/" + g.max : ""))) + '</title></circle>'; });
            var last = minePts[minePts.length - 1];
            svg += '<text x="' + (xOf(last.date) + 8) + '" y="' + (yOf(mode === "dev" ? last.dev : last.score) + 4) + '" font-size="11.5" font-weight="700" fill="#19212a">' + esc(sub) + ' ' + (mode === "dev" ? last.dev : last.score) + '</text>';
          });
          svg += '</svg>';
          if (subjects.length >= 2) svg += '<div class="legend">' + subjects.map(function (s, i) { return '<span><i style="background:' + colorFor(s, i) + '"></i>' + esc(s) + '</span>'; }).join("") + '</div>';
          return svg;
        }

        function renderParent() {
          var d = P;
          var html = '<div class="parentbar"><span style="flex:1"><strong>保護者ページ</strong> ' + esc(d.name) + 'さん</span><button class="btn-sm" data-action="parentclose">生徒のページに戻る</button></div>';
          var tm = d.thisMonth || {};
          html += '<h2>今月の授業 <span class="cnt">' + esc(d.month) + '</span></h2><div class="row" style="align-items:stretch">';
          html += '<div class="card" style="flex:1;min-width:150px"><div class="small muted">実施済み</div><div class="stat">' + (tm.count || 0) + '<small>回 / ' + (tm.minutes || 0) + '分</small></div></div>';
          html += '<div class="card" style="flex:1;min-width:150px"><div class="small muted">' + (tm.mode === "monthly" ? "月謝" : "授業料(時間換算)") + '</div><div class="stat">' + yen(tm.fee) + '</div><div class="small muted">' + (tm.mode === "monthly" ? "月額固定" : "30分 " + yen(d.rate30) + " × 実施時間") + '</div></div></div>';

          html += '<h2>お支払い状況</h2>';
          var pays = d.payments || [];
          if (!pays.length) html += '<div class="empty">請求・入金の記録はまだありません</div>';
          else {
            html += '<div class="card tbwrap"><table class="tb"><tr><th>月</th><th>金額</th><th>状態</th><th>入金日</th></tr>';
            pays.forEach(function (p) { html += '<tr><td>' + esc(p.ym) + '</td><td>' + yen(p.amount) + '</td><td>' + (p.status === "入金済" ? '<span class="tag green">入金済</span>' : '<span class="tag red">未入金</span>') + '</td><td>' + (p.paidDate ? fmtDY(p.paidDate) : "—") + '</td></tr>'; });
            html += '</table></div>';
          }

          var grades = d.grades || [];
          html += '<h2>成績推移 <span class="cnt">' + grades.length + '件</span>' + (grades.some(function (g) { return g.dev !== null; }) ? '<span class="seg" style="margin-left:auto"><button data-action="gmode" data-m="score" class="' + (gradeMode === "score" ? "on" : "") + '">点数</button><button data-action="gmode" data-m="dev" class="' + (gradeMode === "dev" ? "on" : "") + '">偏差値</button></span>' : "") + '</h2>';
          html += '<div class="card">' + gradeChart(grades, gradeMode);
          if (grades.length) {
            html += '<div class="tbwrap" style="margin-top:10px"><table class="tb"><tr><th>日付</th><th>テスト</th><th>科目</th><th>点数</th><th>偏差値</th><th>順位</th></tr>';
            grades.slice().reverse().forEach(function (g) { html += '<tr><td>' + fmtDY(g.date) + '</td><td>' + esc(g.test) + '</td><td>' + esc(g.subject) + '</td><td>' + g.score + (g.max ? '<span class="muted">/' + g.max + '</span>' : "") + '</td><td>' + (g.dev === null ? "—" : g.dev) + '</td><td>' + esc(g.rank || "—") + '</td></tr>'; });
            html += '</table></div>';
          }
          html += '</div>';

          var months = d.months || [];
          if (months.length) {
            html += '<h2>月ごとの授業</h2><div class="card tbwrap"><table class="tb"><tr><th>月</th><th>実施</th><th>時間</th></tr>';
            months.forEach(function (m) { html += '<tr><td>' + (+m.ym.slice(0, 4)) + '年' + (+m.ym.slice(5)) + '月</td><td>' + m.count + '回</td><td>' + m.minutes + '分</td></tr>'; });
            html += '</table></div>';
          }
          html += '<footer class="app"><span></span><span></span></footer>';
          app.innerHTML = html;
        }

        function render() { renderStudent(); }

        function loadParent(ptoken) {
          busy = true; render();
          apiPost({ action: "parentData", k: myKey(), ptoken: ptoken }).then(function (res) {
            busy = false;
            if (res.error) { ssDel("sw_pt"); parentStep = "pass"; toast(res.error); render(); return; }
            P = res.data; parentStep = "data"; render(); window.scrollTo(0, 0);
          }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });
        }

        /* ---------- 操作 ---------- */
        app.addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-action]");
          if (!btn || btn.disabled) return;
          var act = btn.getAttribute("data-action"), id = btn.getAttribute("data-id");
          switch (act) {
            case "closebar": pending = null; render(); break;
            case "calprev": calM--; if (calM < 0) { calM = 11; calY--; } pending = null; render(); break;
            case "calnext": calM++; if (calM > 11) { calM = 0; calY++; } pending = null; render(); break;
            case "calday":
              if (selMode) { var nd = btn.getAttribute("data-date"); selDays[nd] = !selDays[nd]; render(); break; }
              selDate = btn.getAttribute("data-date"); selManual = true; pending = null; render(); break;
            case "panel":
              var p = btn.getAttribute("data-p");
              if (panel === p) { panel = ""; selMode = ""; selDays = {}; render(); break; }
              panel = p; selMode = p; selDays = {}; pending = null; render();
              var calEl0 = document.querySelector(".cal"); if (calEl0) calEl0.scrollIntoView({ behavior: "smooth", block: "start" });
              break;
            case "dayact":
              selMode = btn.getAttribute("data-m"); panel = selMode; selDays = {}; selDays[btn.getAttribute("data-date")] = true; pending = null; render();
              var calEl2 = document.querySelector(".cal"); if (calEl2) calEl2.scrollIntoView({ behavior: "smooth", block: "start" });
              break;
            case "selstart":
              selMode = btn.getAttribute("data-m"); selDays = {}; pending = null; render();
              var calEl1 = document.querySelector(".cal"); if (calEl1) calEl1.scrollIntoView({ behavior: "smooth", block: "start" });
              break;
            case "selcancel": selMode = ""; selDays = {}; render(); break;
            case "selapply":
              var chosen = Object.keys(selDays).filter(function (d) { return selDays[d]; }).sort();
              if (!chosen.length) { toast("日付をえらんでください"); return; }
              if (selMode === "ng") {
                var ngBy2 = {}; (S.blocked || []).forEach(function (b) { (ngBy2[b.date] = ngBy2[b.date] || []).push(b.id); });
                var addD2 = chosen.filter(function (d) { return !ngBy2[d]; }), remIds2 = [];
                chosen.forEach(function (d) { if (ngBy2[d]) remIds2 = remIds2.concat(ngBy2[d]); });
                var ngNote2 = val("b-ngnote");
                selMode = ""; selDays = {};
                studentAction({ action: "blockSet", k: myKey(), add: addD2, removeIds: remIds2, note: ngNote2 }, "登録しました");
              } else if (selMode === "wish") {
                var bws = val("b-wstart"), bwn = val("b-wnote");
                if (!bws) { toast("開始時刻を入れてください"); return; }
                var body = { action: "wishMany", k: myKey(), kind: wishKind, dates: chosen, start: bws, note: bwn };
                if (wishKind === "want") body.min = +(val("b-wmin") || 90);
                else { var bwe = val("b-wend"); if (!bwe || bws >= bwe) { toast("時間帯は「開始 < 終了」で入れてください"); return; } body.end = bwe; }
                selMode = ""; selDays = {};
                studentAction(body, "希望を先生に送りました(" + chosen.length + "日)");
              } else if (selMode === "event") {
                var bet = val("b-etitle"), beb = !!(document.getElementById("b-eblock") || {}).checked;
                if (!bet) { toast("予定の内容を入れてください"); return; }
                var ranges = groupDays(chosen);
                selMode = ""; selDays = {};
                studentAction({ action: "eventAddMany", k: myKey(), ranges: ranges, title: bet, alsoBlock: beb }, "先生に共有しました");
              }
              break;
            case "askaccept": pending = { kind: "accept", slotId: id }; render(); break;
            case "doaccept": studentAction({ action: "accept", slotId: pending.slotId, k: myKey() }, "授業が確定しました ✓"); break;
            case "askdecline": pending = { kind: "decline", slotId: id }; render(); break;
            case "dodecline": studentAction({ action: "decline", slotId: pending.slotId, k: myKey() }, "先生に伝えました"); break;
            case "askcancel": pending = { kind: "cancel", slotId: id }; render(); break;
            case "docancel":
              var reason = val("f-creason");
              studentAction({ action: "cancelReq", slotId: pending.slotId, k: myKey(), reason: reason }, "先生に取消を依頼しました"); break;
            case "askwithdraw": pending = { kind: "withdraw", slotId: id }; render(); break;
            case "dowithdraw": studentAction({ action: "cancelReq", withdraw: true, slotId: pending.slotId, k: myKey() }, "依頼を取り下げました"); break;
            case "wkind": wishKind = btn.getAttribute("data-k"); render(); break;
            case "addwish":
              var wd = val("f-wdate"), ws = val("f-wstart"), wn = val("f-wnote");
              if (!wd) { toast("日付をえらんでください"); return; }
              if (!ws) { toast("開始時刻を入れてください"); return; }
              if (wishKind === "want") studentAction({ action: "wish", kind: "want", k: myKey(), date: wd, start: ws, min: +(val("f-wmin") || 90), note: wn }, "希望を先生に送りました");
              else { var we = val("f-wend"); if (!we || ws >= we) { toast("時間帯は「開始 < 終了」で入れてください"); return; } studentAction({ action: "wish", kind: "ok", k: myKey(), date: wd, start: ws, end: we, note: wn }, "授業できる時間帯を先生に送りました"); }
              break;
            case "delwish": studentAction({ action: "unwish", k: myKey(), wishId: id }, "希望を取り消しました"); break;
            case "addevent":
              var ed = val("f-edate"), ed2 = val("f-edate2"), et = val("f-etitle"), eb = !!(document.getElementById("f-eblock") || {}).checked;
              if (!ed) { toast("日付をえらんでください"); return; }
              if (!et) { toast("予定の内容を入れてください"); return; }
              studentAction({ action: "eventAdd", k: myKey(), date: ed, dateTo: ed2 || ed, title: et, alsoBlock: eb }, "先生に共有しました"); break;
            case "delevent": studentAction({ action: "eventDel", k: myKey(), eventId: id }, "予定を取り消しました"); break;
            case "addblock":
              var bd = val("f-bdate"), bdto = val("f-bdate2"), bn = val("f-bnote");
              if (!bd) { toast("日付をえらんでください"); return; }
              studentAction({ action: "block", k: myKey(), date: bd, dateTo: bdto || bd, note: bn }, "登録しました"); break;
            case "delblock":
              var sids = btn.getAttribute("data-ids");
              studentAction({ action: "unblock", k: myKey(), blockIds: sids ? sids.split(",") : [id] }, "解除しました"); break;
            case "parentopen":
              var saved = ssGet("sw_pt");
              var ppass = (document.getElementById("f-ppass") || {}).value || "";
              if (saved && !ppass) { loadParent(saved); return; }
              if (!ppass) { toast("パスワードを入れてください"); return; }
              busy = true; render();
              apiPost({ action: "parentLogin", k: myKey(), pass: ppass }).then(function (res) {
                busy = false;
                if (res.error) { toast(res.error); render(); return; }
                ssSet("sw_pt", res.ptoken); loadParent(res.ptoken);
              }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });
              break;
            case "parentclose": parentStep = ""; P = null; render(); window.scrollTo(0, 0); break;
            case "gmode": gradeMode = btn.getAttribute("data-m"); render(); break;
          }
        });

        /* ---------- 起動 ---------- */
        try {
          var qs = new URLSearchParams(location.search);
          var qk = qs.get("k"), qp = qs.get("preview");
          if (qk) { lsSet("sw_k", qk); history.replaceState(null, "", location.pathname); }
          else if (qp) { if (lsGet("sw_admt")) previewK = qp; history.replaceState(null, "", location.pathname); }
          else if (qs.toString()) history.replaceState(null, "", location.pathname);
        } catch (e) {}
        loadState().catch(function () {
          app.innerHTML = '<div class="loading">読み込みに失敗しました。<br>電波の良いところで再読み込みしてください。</div>';
        });
      })();
    </script>
  </body>
</html>
