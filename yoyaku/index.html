<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>授業の予約 | ステップワイズ英数教室・個別指導部</title>
    <meta
      name="description"
      content="ステップワイズ個別指導の授業予約ページです。空いている枠をえらんで予約できます。"
    />
    <style>
      :root {
        --ink: #19212a;
        --muted: #64717f;
        --line: #dbe3ea;
        --paper: #fbfcfd;
        --soft: #eef4fb;
        --primary: #0717a8;
        --primary-dark: #07106f;
        --coral: #d86f8d;
        --coral-soft: #fbeef2;
        --danger: #c0392b;
        --taken: #eef1f4;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(31, 48, 64, 0.1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.7;
        padding-bottom: 120px;
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px clamp(16px, 4vw, 40px);
        background: rgba(251, 252, 253, 0.92);
        border-bottom: 1px solid var(--line);
      }
      .brand { font-weight: 700; line-height: 1.25; font-size: 15px; }
      .brand small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
      .site-header a { color: var(--muted); font-size: 13px; text-decoration: none; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
      h1 { font-size: 21px; margin: 22px 0 2px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      h2 {
        font-size: 15px; font-weight: 700; margin: 26px 0 10px;
        display: flex; align-items: center; gap: 8px;
      }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      .card {
        background: var(--white); border: 1px solid var(--line);
        border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
      }
      select, input[type="text"], input[type="password"], input[type="date"], input[type="time"] {
        font: inherit; color: var(--ink); background: var(--white);
        border: 1px solid var(--line); border-radius: 10px;
        padding: 8px 10px; max-width: 100%;
      }
      select:focus, input:focus, button:focus-visible {
        outline: 2px solid var(--primary); outline-offset: 1px;
      }
      button {
        font: inherit; cursor: pointer; border: none; border-radius: 10px;
        padding: 9px 14px; font-weight: 600;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .btn-primary { background: var(--primary); color: var(--white); }
      .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
      .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      /* カレンダー */
      .cal { padding: 12px 12px 10px; }
      .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .callabel { font-weight: 700; font-size: 15px; }
      .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
      .calwd { font-size: 11px; color: var(--muted); padding: 2px 0; }
      .calwd.sun { color: var(--danger); }
      .calwd.sat { color: var(--primary); }
      .calday {
        position: relative; display: flex; flex-direction: column; align-items: center;
        justify-content: flex-start; gap: 1px; padding: 4px 0 3px; min-height: 42px;
        border-radius: 9px; border: 1px solid transparent; background: transparent;
        font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink);
      }
      button.calday { cursor: pointer; font-size: 13px; }
      .calday.sun { color: var(--danger); }
      .calday.sat { color: var(--primary); }
      .calday.off { opacity: 0.35; }
      .calday.today { border-color: var(--muted); }
      .calday.mine:not(.sel) { background: var(--coral-soft); }
      .calday.sel { background: var(--primary); color: var(--white); border-color: var(--primary); }
      .caldot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
      .caldot.op { background: var(--primary); }
      .caldot.tk { background: var(--muted); }
      .calday.sel .caldot { background: var(--white); }
      .calmark { font-size: 10px; line-height: 1; color: var(--coral); font-weight: 700; }
      .calday.sel .calmark { color: var(--white); }
      .calmarks { display: flex; align-items: center; gap: 2px; min-height: 7px; }
      .callegend {
        display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px;
        font-size: 11.5px; color: var(--muted);
      }
      .callegend span { display: inline-flex; align-items: center; gap: 4px; }
      /* 枠チップ */
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        font-variant-numeric: tabular-nums;
        border-radius: 10px; padding: 8px 12px; font-size: 14px;
        border: 1px solid var(--line); background: var(--white);
        display: inline-flex; align-items: center; gap: 6px;
      }
      button.chip { cursor: pointer; font-weight: 600; }
      .chip.open { border-color: var(--primary); color: var(--primary); }
      .chip.mine { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); font-weight: 700; }
      .chip.taken { background: var(--taken); color: var(--muted); }
      .chip.offer { background: #fdf3e3; border-color: #d99a2b; color: #a8721c; font-weight: 700; }
      .caldot.of { background: #d99a2b; }
      .calday.sel .caldot.of { background: var(--white); }
      .tag.offer { background: #fdf3e3; color: #a8721c; }
      .chip.sel { background: var(--primary); color: var(--white); border-color: var(--primary); }
      .empty { color: var(--muted); font-size: 13.5px; padding: 8px 2px; }
      .slotline {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
      }
      .slotline:last-child { border-bottom: none; }
      .slotline .time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 104px; }
      .slotline .who { flex: 1; min-width: 80px; }
      .slotline .who .name { font-weight: 700; }
      .tag { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; font-weight: 700; }
      .tag.open { background: var(--soft); color: var(--primary); }
      .tag.done { background: var(--taken); color: var(--muted); }
      .tag.booked { background: var(--coral-soft); color: var(--coral); }
      .daygroup { margin-bottom: 14px; }
      .daylabel { font-weight: 700; font-size: 14px; margin: 0 0 6px 2px; }
      .daylabel .wd { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .daylabel .wd.sat { color: var(--primary); }
      .daylabel .wd.sun { color: var(--danger); }
      .formgrid { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
      .formgrid label { font-size: 13px; color: var(--muted); }
      .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
      .loglist { font-size: 13px; color: var(--muted); }
      .loglist div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
      .loglist div:last-child { border-bottom: none; }
      table.rec { border-collapse: collapse; width: 100%; font-size: 13.5px; }
      table.rec th, table.rec td {
        text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
      }
      table.rec th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .studentline { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .studentline:last-child { border-bottom: none; }
      .studentline .nm { flex: 1; font-weight: 600; }
      .confirmbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        background: var(--white); border-top: 1px solid var(--line);
        box-shadow: 0 -4px 16px rgba(31, 48, 64, 0.12);
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      }
      .confirmbar .inner { max-width: 640px; margin: 0 auto; }
      .confirmbar .msg { font-weight: 700; margin-bottom: 10px; }
      #toast {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: 24px; z-index: 30;
        background: var(--ink); color: var(--paper);
        border-radius: 99px; padding: 9px 18px; font-size: 13.5px;
        opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 88vw;
      }
      @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
      #toast.show { opacity: 1; }
      .loading { text-align: center; color: var(--muted); padding: 60px 0; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 12px;
        border: 3px solid var(--line); border-top-color: var(--primary);
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      footer.app {
        margin-top: 44px; padding: 16px 0 24px;
        display: flex; justify-content: space-between; align-items: center;
        color: var(--muted); font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="brand">ステップワイズ個別指導<small>英数教室・個別指導部</small></span>
      <a href="../">トップページへ</a>
    </header>
    <div class="wrap" id="app">
      <div class="loading"><div class="spinner"></div>読み込んでいます…</div>
    </div>
    <div id="toast" role="status"></div>

    <script>
      (function () {
        "use strict";
        /* デプロイしたApps ScriptウェブアプリのURL(/exec)をここに設定 */
        var API = "https://script.google.com/macros/s/AKfycbz53sl4GgKNY1UY1gaBndjDplQk5MrA9EfShYfy05Jl4JNEFEl7-B1uKSmd0v5Mhn4Irw/exec";

        var app = document.getElementById("app");
        var WD = ["日", "月", "火", "水", "木", "金", "土"];
        var S = null;          // 生徒向け状態 {students, slots, today}
        var A = null;          // 先生向け状態
        var pending = null;    // {kind, slotId}
        var busy = false;
        var calNow = new Date();
        var calY = calNow.getFullYear(), calM = calNow.getMonth();
        var selDate = null, selManual = false;

        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
        function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
        function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function pad(n) { return String(n).length < 2 ? "0" + n : String(n); }
        function wdOf(ds) { var p = ds.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
        function fmtDate(ds) { var p = ds.split("-"); return (+p[1]) + "/" + (+p[2]); }
        function fmtDateW(ds) { return fmtDate(ds) + "(" + WD[wdOf(ds)] + ")"; }
        function endTime(start, min) {
          var p = start.split(":");
          var t = (+p[0]) * 60 + (+p[1]) + (+min);
          return pad(Math.floor(t / 60) % 24) + ":" + pad(t % 60);
        }
        var editEmailId = null; // 先生モードでメール編集中の生徒id
        function gcalUrl(s) {
          var d = s.date.replace(/-/g, "");
          var st = s.start.replace(":", "");
          var en = endTime(s.start, s.min).replace(":", "");
          var u = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
            "&text=" + encodeURIComponent("塾の授業(ステップワイズ)") +
            "&dates=" + d + "T" + st + "00/" + d + "T" + en + "00&ctz=Asia/Tokyo";
          if (s.meet) u += "&details=" + encodeURIComponent("Meetで参加: " + s.meet);
          return u;
        }
        var toastTimer = null;
        function toast(msg) {
          var t = document.getElementById("toast");
          t.textContent = msg; t.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800);
        }

        /* ---------- API ---------- */
        function apiGet(params) {
          var q = Object.keys(params).map(function (k) {
            return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
          }).join("&");
          return fetch(API + "?" + q).then(function (r) { return r.json(); });
        }
        function apiPost(body) {
          return fetch(API, { method: "POST", body: JSON.stringify(body) })
            .then(function (r) { return r.json(); });
        }

        function myKey() { return lsGet("sw_k") || ""; }

        function loadState() {
          return apiGet({ action: "state", k: myKey() }).then(function (res) {
            if (res.error) throw new Error(res.error);
            S = res;
            render();
          });
        }

        /* ---------- カレンダー ---------- */
        function renderCal(info, today, kind) {
          var label = calY + "年" + (calM + 1) + "月";
          var minIdx = calNow.getFullYear() * 12 + calNow.getMonth();
          var curIdx = calY * 12 + calM;
          var maxIdx = minIdx + 3;
          var h = '<div class="card cal"><div class="calhead">';
          h += '<button class="btn-quiet btn-sm" data-action="calprev"' + (curIdx <= minIdx ? " disabled" : "") + ' aria-label="前の月">◀</button>';
          h += '<span class="callabel">' + label + "</span>";
          h += '<button class="btn-quiet btn-sm" data-action="calnext"' + (curIdx >= maxIdx ? " disabled" : "") + ' aria-label="次の月">▶</button>';
          h += '</div><div class="calgrid">';
          WD.forEach(function (w, i) {
            h += '<span class="calwd' + (i === 0 ? " sun" : i === 6 ? " sat" : "") + '">' + w + "</span>";
          });
          var startWd = new Date(calY, calM, 1).getDay();
          for (var i = 0; i < startWd; i++) h += "<span></span>";
          var days = new Date(calY, calM + 1, 0).getDate();
          for (var d = 1; d <= days; d++) {
            var ds = calY + "-" + pad(calM + 1) + "-" + pad(d);
            var it = info[ds];
            var wd = (startWd + d - 1) % 7;
            var cls = "calday";
            if (wd === 0) cls += " sun";
            if (wd === 6) cls += " sat";
            if (ds === today) cls += " today";
            if (ds === selDate) cls += " sel";
            var past = ds < today;
            var marks = '<span class="calmarks">';
            if (it && !past) {
              if (kind === "teacher") {
                if (it.booked) marks += '<span class="caldot op"></span>';
                if (it.offered) marks += '<span class="caldot of"></span>';
              } else {
                if (it.mine) { marks += '<span class="calmark">✓</span>'; cls += " mine"; }
                if (it.offer) marks += '<span class="caldot of"></span>';
              }
            }
            marks += "</span>";
            var clickable = !past && (it || kind === "teacher");
            if (!clickable) {
              h += '<span class="' + cls + ' off">' + d + marks + "</span>";
            } else {
              h += '<button class="' + cls + '" data-action="calday" data-date="' + ds + '">' + d + marks + "</button>";
            }
          }
          h += '</div><div class="callegend">';
          if (kind === "teacher") {
            h += '<span><span class="caldot op"></span> 確定した授業</span>';
            h += '<span><span class="caldot of"></span> 返事待ちの提案</span>';
          } else {
            h += '<span><span class="caldot of"></span> 先生からの提案</span>';
            h += '<span><span class="calmark">✓</span> あなたの授業</span>';
          }
          h += "</div></div>";
          return h;
        }

        /* ---------- 生徒画面 ---------- */
        function renderGuard() {
          var html = "";
          html += '<div class="card" style="margin-top:26px;text-align:center;padding:28px 20px">';
          html += '<div style="font-weight:700;font-size:16px;margin-bottom:8px">専用リンクからひらいてください</div>';
          html += '<div style="font-size:13.5px;color:var(--muted)">この予約ページは、先生からLINEで送られた<br>あなた専用のリンクからひらく必要があります。<br>リンクが分からないときは、LINEで先生に連絡してください。</div>';
          html += "</div>";
          html += '<footer class="app"><span></span><button class="btn-quiet btn-sm" data-action="teacher">先生用</button></footer>';
          app.innerHTML = html;
        }

        function renderStudent() {
          if (!S || !S.me) { renderGuard(); return; }
          var today = S.today;
          var slots = S.slots.slice().sort(function (a, b) {
            return a.date === b.date ? (a.start < b.start ? -1 : 1) : (a.date < b.date ? -1 : 1);
          });

          var html = "";
          html += '<h1>授業の予約</h1><p class="sub">' + esc(S.me.name) + 'さんの予約ページです</p>';

          var offers = slots.filter(function (s) { return s.st === "offer"; });
          if (offers.length > 0) {
            html += "<h2>先生からの提案</h2>";
            html += '<div class="card">';
            offers.forEach(function (s) {
              html += '<div class="slotline"><span class="time">' + fmtDateW(s.date) + " " + s.start + "〜" + endTime(s.start, s.min) + "</span>";
              html += '<span class="who"></span>';
              html += '<button class="btn-primary btn-sm" data-action="askaccept" data-id="' + esc(s.id) + '">この時間でOK</button>';
              html += '<button class="btn-quiet btn-sm" data-action="askdecline" data-id="' + esc(s.id) + '">都合が悪い</button>';
              html += "</div>";
            });
            html += '</div><div class="note">OKすると授業が確定し、カレンダー登録とMeetリンクの発行が行われます。</div>';
          }

          var mine = slots.filter(function (s) { return s.st === "mine"; });
          html += "<h2>あなたの予約</h2>";
          if (mine.length === 0) {
            html += '<div class="empty">予約はまだありません。下のカレンダーからえらんでください。</div>';
          } else {
            html += '<div class="card">';
            mine.forEach(function (s) {
              html += '<div class="slotline"><span class="time">' + fmtDateW(s.date) + " " + s.start + "〜" + endTime(s.start, s.min) + "</span>";
              html += '<span class="who"></span>';
              if (s.meet) html += '<a class="btn-primary btn-sm" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(s.meet) + '">Meetに参加</a>';
              html += '<a class="btn-ghost btn-sm" style="text-decoration:none" target="_blank" rel="noopener" href="' + gcalUrl(s) + '">カレンダーに追加</a>';
              html += '<button class="btn-quiet btn-sm" data-action="askcancel" data-id="' + esc(s.id) + '">取り消す</button>';
              html += "</div>";
            });
            html += "</div>";
          }

          html += "<h2>予定表</h2>";
          var byDate = {}, dates = [];
          slots.forEach(function (s) {
            if (!byDate[s.date]) { byDate[s.date] = []; dates.push(s.date); }
            byDate[s.date].push(s);
          });
          function hasVisible(d) {
            return (byDate[d] || []).some(function (s) { return s.st === "offer" || s.st === "mine"; });
          }
          if (selDate === null || (!selManual && !hasVisible(selDate))) {
            var found = null;
            for (var di = 0; di < dates.length; di++) {
              if (hasVisible(dates[di])) { found = dates[di]; break; }
            }
            selDate = found || today;
            var sp = selDate.split("-");
            calY = +sp[0]; calM = +sp[1] - 1;
          }
          var info = {};
          slots.forEach(function (s) {
            var it = info[s.date] || (info[s.date] = { offer: 0, mine: 0 });
            it[s.st]++;
          });
          html += renderCal(info, today, "student");

          if (slots.length === 0) {
            html += '<div class="empty">いま予定はありません。先生から提案が届くとここに表示されます。</div>';
          } else {
            var dwd = wdOf(selDate);
            html += "<h2>" + fmtDate(selDate) + "(" + WD[dwd] + ")の予定</h2>";
            var ds2 = byDate[selDate] || [];
            if (ds2.length === 0) {
              html += '<div class="empty">この日の予定はありません。印の付いた日をタップしてください。</div>';
            } else {
              html += '<div class="chips">';
              ds2.forEach(function (s) {
                var label = s.start + "〜" + endTime(s.start, s.min);
                if (s.st === "mine") {
                  html += '<span class="chip mine">✓ ' + label + "</span>";
                } else if (s.st === "offer") {
                  html += '<button class="chip offer" data-action="askaccept" data-id="' + esc(s.id) + '">提案 ' + label + "</button>";
                }
              });
              html += "</div>";
            }
          }

          html += '<footer class="app"><span>ページを開くと最新の状態になります</span><button class="btn-quiet btn-sm" data-action="teacher">先生用</button></footer>';

          if (pending) {
            var s = null;
            for (var i = 0; i < slots.length; i++) if (slots[i].id === pending.slotId) s = slots[i];
            if (s) {
              var when = fmtDateW(s.date) + " " + s.start + "〜" + endTime(s.start, s.min);
              html += '<div class="confirmbar"><div class="inner">';
              if (pending.kind === "accept") {
                html += '<div class="msg">' + when + " の授業をOKして確定しますか?</div>";
                html += '<div class="row"><button class="btn-primary" data-action="doaccept"' + (busy ? " disabled" : "") + ">" + (busy ? "確定しています…" : "OKして確定する") + '</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
              } else if (pending.kind === "decline") {
                html += '<div class="msg">' + when + " の提案を「都合が悪い」と先生に伝えますか?</div>";
                html += '<div class="row"><button class="btn-danger" data-action="dodecline"' + (busy ? " disabled" : "") + ">" + (busy ? "送信しています…" : "都合が悪いと伝える") + '</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
              } else if (pending.kind === "cancel") {
                html += '<div class="msg">' + when + " の予約を取り消しますか?</div>";
                html += '<div class="row"><button class="btn-danger" data-action="docancel"' + (busy ? " disabled" : "") + ">" + (busy ? "取り消しています…" : "取り消す") + '</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
              }
              html += "</div></div>";
            }
          }
          app.innerHTML = html;
        }

        /* ---------- 先生画面 ---------- */
        function renderTeacher() {
          var today = A.today;
          var slots = A.slots.slice().sort(function (a, b) {
            return a.date === b.date ? (a.start < b.start ? -1 : 1) : (a.date < b.date ? -1 : 1);
          });
          var upcoming = slots.filter(function (s) { return s.date >= today; });
          var past = slots.filter(function (s) { return s.date < today; }).reverse();

          var html = "";
          html += '<div class="row between" style="margin-top:22px"><div><h1 style="margin:0">先生モード</h1></div><button class="btn-quiet btn-sm" data-action="exitteacher">生徒画面へ</button></div>';

          function teacherRow(s, withDate) {
            var h = '<div class="slotline"><span class="time">' + (withDate ? fmtDateW(s.date) + " " : "") + s.start + "〜" + endTime(s.start, s.min) + "</span>";
            if (s.status === "booked") {
              h += '<span class="who"><span class="name">' + esc(s.studentName) + '</span> <span class="tag booked">確定</span></span>';
              if (s.meetUrl) h += '<a class="btn-ghost btn-sm" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(s.meetUrl) + '">Meet</a>';
              h += '<button class="btn-quiet btn-sm" data-action="unbook" data-id="' + esc(s.id) + '">予約解除</button>';
            } else if (s.status === "offered") {
              h += '<span class="who"><span class="name">' + esc(s.studentName) + '</span> <span class="tag offer">返事待ち</span></span>';
              h += '<button class="btn-quiet btn-sm" data-action="delslot" data-id="' + esc(s.id) + '">取り下げ</button>';
            } else {
              h += '<span class="who"><span class="tag open">空き</span></span>';
              h += '<button class="btn-quiet btn-sm" data-action="delslot" data-id="' + esc(s.id) + '">枠を削除</button>';
            }
            return h + "</div>";
          }

          var offered = upcoming.filter(function (s) { return s.status === "offered"; });
          if (offered.length > 0) {
            html += "<h2>返事待ちの提案</h2><div class=\"card\">";
            offered.forEach(function (s) { html += teacherRow(s, true); });
            html += "</div>";
          }

          html += "<h2>予定表</h2>";
          var byDate = {}, dates = [];
          upcoming.forEach(function (s) {
            if (!byDate[s.date]) { byDate[s.date] = []; dates.push(s.date); }
            byDate[s.date].push(s);
          });
          if (selDate === null || (!selManual && !byDate[selDate])) {
            selDate = dates.length > 0 ? dates[0] : today;
            var spt = selDate.split("-");
            calY = +spt[0]; calM = +spt[1] - 1;
          }
          var tinfo = {};
          upcoming.forEach(function (s) {
            var it = tinfo[s.date] || (tinfo[s.date] = { booked: 0, offered: 0 });
            if (s.status === "booked") it.booked++;
            else if (s.status === "offered") it.offered++;
          });
          html += renderCal(tinfo, today, "teacher");

          var dwdT = wdOf(selDate);
          html += "<h2>" + fmtDate(selDate) + "(" + WD[dwdT] + ")の授業</h2>";
          var dayRows = byDate[selDate] || [];
          if (dayRows.length === 0) {
            html += '<div class="empty">この日の授業はありません。下のフォームから提案できます(日付は選択済み)。</div>';
          } else {
            html += '<div class="card">';
            dayRows.forEach(function (s) { html += teacherRow(s, false); });
            html += "</div>";
          }
          if (upcoming.length > 0) {
            html += '<div class="row" style="margin-top:10px"><button class="btn-ghost btn-sm" data-action="copyweek">今後7日の予定をコピー(LINE用)</button></div>';
          }

          html += '<h2>授業を提案</h2><div class="card"><div class="formgrid">';
          html += '<label for="f-student">生徒</label><select id="f-student"><option value="">えらんでください</option>';
          A.students.filter(function (x) { return x.active; }).forEach(function (x) {
            html += '<option value="' + esc(x.id) + '">' + esc(x.name) + "</option>";
          });
          html += "</select>";
          var formDate = (selDate && selDate >= today) ? selDate : today;
          html += '<label for="f-date">日付</label><input type="date" id="f-date" min="' + today + '" value="' + formDate + '">';
          html += '<label for="f-start">開始</label><input type="time" id="f-start" value="17:00" step="300">';
          html += '<label for="f-min">長さ</label><select id="f-min"><option value="30">30分</option><option value="45">45分</option><option value="60" selected>60分</option><option value="90">90分</option><option value="120">120分</option></select>';
          html += '<label for="f-rep">くり返し</label><select id="f-rep"><option value="1">この日だけ</option><option value="2">毎週×2回</option><option value="4">毎週×4回</option><option value="8">毎週×8回</option><option value="12">毎週×12回</option></select>';
          html += '</div><div class="row" style="margin-top:12px"><button class="btn-primary" data-action="offerslot"' + (busy ? " disabled" : "") + ">" + (busy ? "送信中…" : "この内容で提案する") + "</button></div>";
          html += '<div class="note">提案は生徒の予約ページに表示されます(メール登録済みの生徒にはメールでもお知らせ)。生徒がOKすると授業が確定し、カレンダー登録・Meet発行・確定通知が行われます。</div></div>';

          html += "<h2>最近の動き</h2>";
          if (A.log.length === 0) {
            html += '<div class="empty">まだ動きはありません。</div>';
          } else {
            html += '<div class="card loglist">';
            A.log.slice(0, 15).forEach(function (l) {
              html += "<div>" + esc(l.time) + " " + esc(l.message) + "</div>";
            });
            html += "</div>";
          }

          html += "<h2>実施の記録</h2>";
          var pastBooked = past.filter(function (s) { return s.status === "booked"; });
          if (pastBooked.length === 0) {
            html += '<div class="empty">過去の授業はまだありません。</div>';
          } else {
            var months = {}, mkeys = [];
            pastBooked.forEach(function (s) {
              if (!s.done) return;
              var mk = s.date.slice(0, 7);
              if (!months[mk]) { months[mk] = {}; mkeys.push(mk); }
              months[mk][s.studentName] = (months[mk][s.studentName] || 0) + 1;
            });
            if (mkeys.length > 0) {
              html += '<div class="card"><table class="rec"><tr><th>月</th><th>生徒</th><th>実施</th></tr>';
              mkeys.sort().reverse().forEach(function (mk) {
                Object.keys(months[mk]).sort().forEach(function (nm, i) {
                  html += "<tr><td>" + (i === 0 ? esc((+mk.slice(5, 7)) + "月") : "") + "</td><td>" + esc(nm) + "</td><td>" + months[mk][nm] + "回</td></tr>";
                });
              });
              html += "</table></div>";
            }
            html += '<div class="card" style="margin-top:10px">';
            pastBooked.slice(0, 20).forEach(function (s) {
              html += '<div class="slotline"><span class="time">' + fmtDateW(s.date) + " " + s.start + "</span>";
              html += '<span class="who"><span class="name">' + esc(s.studentName) + "</span>" + (s.done ? ' <span class="tag done">実施済</span>' : "") + "</span>";
              html += '<button class="btn-quiet btn-sm" data-action="toggledone" data-id="' + esc(s.id) + '">' + (s.done ? "実施を取消" : "実施にする") + "</button>";
              html += "</div>";
            });
            html += '</div><div class="note">「実施にする」を押すと月ごとの回数に集計されます。</div>';
          }

          html += '<h2>生徒の管理</h2><div class="card">';
          var act = A.students.filter(function (s) { return s.active; });
          if (act.length === 0) {
            html += '<div class="empty">まだ生徒が登録されていません。</div>';
          } else {
            act.forEach(function (s) {
              html += '<div class="studentline"><span class="nm">' + esc(s.name);
              if (s.email) html += ' <span style="font-weight:400;font-size:11.5px;color:var(--muted)">' + esc(s.email) + "</span>";
              html += "</span>";
              if (editEmailId === s.id) {
                html += '<input type="email" id="f-email-' + esc(s.id) + '" value="' + esc(s.email || "") + '" placeholder="生徒のメール" style="width:180px">';
                html += '<button class="btn-primary btn-sm" data-action="saveemail" data-id="' + esc(s.id) + '"' + (busy ? " disabled" : "") + ">保存</button>";
                html += '<button class="btn-quiet btn-sm" data-action="cancelemail">やめる</button>';
              } else {
                html += '<button class="btn-ghost btn-sm" data-action="copylink" data-id="' + esc(s.id) + '">リンクをコピー</button>';
                html += '<button class="btn-quiet btn-sm" data-action="newlink" data-id="' + esc(s.id) + '">再発行</button>';
                html += '<button class="btn-quiet btn-sm" data-action="editemail" data-id="' + esc(s.id) + '">メール</button>';
                html += '<button class="btn-quiet btn-sm" data-action="hidestudent" data-id="' + esc(s.id) + '">外す</button>';
              }
              html += "</div>";
            });
          }
          html += '<div class="row" style="margin-top:12px"><input type="text" id="f-newstudent" placeholder="生徒の名前" style="flex:1;min-width:120px"><input type="email" id="f-newemail" placeholder="メール(任意)" style="flex:1;min-width:150px"><button class="btn-primary btn-sm" data-action="addstudent"' + (busy ? " disabled" : "") + ">追加</button></div>";
          html += '<div class="note">生徒には「リンクをコピー」した<strong>本人専用のリンク</strong>をLINEで送ってください。生徒はそのリンクからだけ予約できます。リンクが他人に知られた場合は「再発行」してください(古いリンクは無効になります)。メールを登録した生徒には予約と同時にカレンダー招待も届きます。</div></div>';

          html += '<h2>設定</h2><div class="card"><div class="row">';
          html += '<label for="f-pin" style="font-size:13px;color:var(--muted)">先生用PIN</label>';
          html += '<input type="text" id="f-pin" inputmode="numeric" maxlength="8" placeholder="新しいPIN" style="width:110px">';
          html += '<button class="btn-quiet btn-sm" data-action="setpin"' + (busy ? " disabled" : "") + ">変更する</button>";
          html += '</div><div class="note">予約データは「予約システム」スプレッドシートにも保存されています。</div></div>';

          html += '<footer class="app"><span></span><span></span></footer>';

          if (pending && (pending.kind === "tdel" || pending.kind === "tcancel")) {
            var s3 = null;
            slots.forEach(function (x) { if (x.id === pending.slotId) s3 = x; });
            if (s3) {
              var when3 = fmtDateW(s3.date) + " " + s3.start + "〜" + endTime(s3.start, s3.min);
              html += '<div class="confirmbar"><div class="inner">';
              if (pending.kind === "tdel") {
                html += '<div class="msg">' + when3 + " の枠を削除しますか?</div>";
                html += '<div class="row"><button class="btn-danger" data-action="dotdel"' + (busy ? " disabled" : "") + '>削除する</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
              } else {
                html += '<div class="msg">' + esc(s3.studentName) + "さんの " + when3 + " の予約を解除しますか?</div>";
                html += '<div class="row"><button class="btn-danger" data-action="dotcancel"' + (busy ? " disabled" : "") + '>解除する</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
              }
              html += "</div></div>";
            }
          }
          app.innerHTML = html;
        }

        function renderPin() {
          var html = "";
          html += '<h1 style="margin-top:22px">先生モード</h1>';
          html += '<div class="card" style="margin-top:14px"><div class="row">';
          html += '<label for="pinin" style="font-weight:700">PIN</label>';
          html += '<input type="password" id="pinin" inputmode="numeric" maxlength="8" style="width:110px" autocomplete="off">';
          html += '<button class="btn-primary btn-sm" data-action="checkpin"' + (busy ? " disabled" : "") + ">" + (busy ? "確認中…" : "入る") + "</button>";
          html += '<button class="btn-quiet btn-sm" data-action="exitteacher">もどる</button>';
          html += "</div></div>";
          app.innerHTML = html;
          var el = document.getElementById("pinin");
          if (el) el.focus();
        }

        function mode() { return ssGet("sw_mode") || "student"; }
        function render() {
          var m = mode();
          if (m === "teacher" && A) renderTeacher();
          else if (m === "pin" || (m === "teacher" && !A)) renderPin();
          else renderStudent();
        }

        /* ---------- 通信つきアクション ---------- */
        function studentAction(body, okMsg) {
          if (busy) return;
          busy = true; render();
          apiPost(body).then(function (res) {
            busy = false; pending = null;
            if (res.error) {
              toast(res.error);
              if (res.badCode) { S = { me: null, slots: [], today: "" }; render(); return; }
              if (res.refresh) return loadState();
              render();
              return;
            }
            S = res.state;
            render();
            if (okMsg) toast(okMsg);
          }).catch(function () {
            busy = false;
            toast("通信に失敗しました。電波の良いところでもう一度お試しください");
            render();
          });
        }

        function adminAction(op, extra, okMsg) {
          if (busy) return;
          busy = true; render();
          var body = { action: "admin", pin: ssGet("sw_pin") || "", op: op };
          Object.keys(extra || {}).forEach(function (k) { body[k] = extra[k]; });
          apiPost(body).then(function (res) {
            busy = false; pending = null;
            if (res.error) {
              toast(res.error);
              if (res.badPin) { ssDel("sw_pin"); A = null; ssSet("sw_mode", "pin"); }
              render();
              return;
            }
            A = res.admin;
            render();
            if (okMsg) toast(okMsg);
          }).catch(function () {
            busy = false;
            toast("通信に失敗しました。もう一度お試しください");
            render();
          });
        }

        /* ---------- イベント ---------- */
        app.addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-action]");
          if (!btn || btn.disabled) return;
          var act = btn.getAttribute("data-action");
          var id = btn.getAttribute("data-id");

          switch (act) {
            case "teacher":
              ssSet("sw_mode", "pin"); render(); break;
            case "exitteacher":
              ssSet("sw_mode", "student"); pending = null;
              selDate = null; selManual = false;
              busy = true; render();
              loadState().catch(function () { toast("通信に失敗しました"); })
                .then(function () { busy = false; render(); });
              break;
            case "checkpin":
              var pin = (document.getElementById("pinin") || {}).value || "";
              ssSet("sw_pin", pin);
              busy = true; render();
              apiPost({ action: "admin", pin: pin, op: "state" }).then(function (res) {
                busy = false;
                if (res.error) { ssDel("sw_pin"); toast(res.error); render(); return; }
                A = res.admin;
                ssSet("sw_mode", "teacher");
                selDate = null; selManual = false;
                render();
              }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });
              break;
            case "closebar":
              pending = null; render(); break;
            case "calprev":
              calM--; if (calM < 0) { calM = 11; calY--; }
              pending = null; render(); break;
            case "calnext":
              calM++; if (calM > 11) { calM = 0; calY++; }
              pending = null; render(); break;
            case "calday":
              selDate = btn.getAttribute("data-date");
              selManual = true; pending = null; render(); break;

            case "askaccept":
              pending = { kind: "accept", slotId: id }; render(); break;
            case "doaccept":
              studentAction({ action: "accept", slotId: pending.slotId, k: myKey() }, "授業が確定しました ✓");
              break;
            case "askdecline":
              pending = { kind: "decline", slotId: id }; render(); break;
            case "dodecline":
              studentAction({ action: "decline", slotId: pending.slotId, k: myKey() }, "先生に伝えました");
              break;
            case "askcancel":
              pending = { kind: "cancel", slotId: id }; render(); break;
            case "docancel":
              studentAction({ action: "cancel", slotId: pending.slotId, k: myKey() }, "予約を取り消しました");
              break;

            case "offerslot":
              var stid = (document.getElementById("f-student") || {}).value;
              var date = (document.getElementById("f-date") || {}).value;
              var start = (document.getElementById("f-start") || {}).value;
              var min = +((document.getElementById("f-min") || {}).value || 60);
              var rep = +((document.getElementById("f-rep") || {}).value || 1);
              if (!stid) { toast("生徒をえらんでください"); return; }
              if (!date || !start) { toast("日付と時間を入れてください"); return; }
              adminAction("offer", { studentId: stid, date: date, start: start, min: min, repeat: rep }, "提案を送りました");
              break;
            case "delslot":
              pending = { kind: "tdel", slotId: id }; render(); break;
            case "dotdel":
              adminAction("deleteSlot", { slotId: pending.slotId }, "枠を削除しました");
              break;
            case "unbook":
              pending = { kind: "tcancel", slotId: id }; render(); break;
            case "dotcancel":
              adminAction("unbook", { slotId: pending.slotId }, "予約を解除しました");
              break;
            case "toggledone":
              adminAction("toggleDone", { slotId: id });
              break;
            case "addstudent":
              var nm = ((document.getElementById("f-newstudent") || {}).value || "").trim();
              var em = ((document.getElementById("f-newemail") || {}).value || "").trim();
              if (!nm) { toast("名前を入れてください"); return; }
              adminAction("addStudent", { name: nm, email: em }, nm + "さんを追加しました");
              break;
            case "editemail":
              editEmailId = id; render(); break;
            case "cancelemail":
              editEmailId = null; render(); break;
            case "saveemail":
              var ev2 = ((document.getElementById("f-email-" + id) || {}).value || "").trim();
              editEmailId = null;
              adminAction("setEmail", { studentId: id, email: ev2 }, ev2 ? "メールを登録しました" : "メールを削除しました");
              break;
            case "copylink":
              var st4 = null;
              A.students.forEach(function (x) { if (x.id === id) st4 = x; });
              if (!st4 || !st4.code) { toast("リンクがまだ発行されていません"); return; }
              copyText(location.origin + location.pathname + "?k=" + st4.code,
                st4.name + "さんの専用リンクをコピーしました。LINEで送ってください");
              break;
            case "newlink":
              adminAction("newCode", { studentId: id }, "リンクを再発行しました(古いリンクは使えなくなります)");
              break;
            case "hidestudent":
              adminAction("hideStudent", { studentId: id }, "生徒を外しました");
              break;
            case "setpin":
              var np = ((document.getElementById("f-pin") || {}).value || "").trim();
              if (np.length < 4) { toast("PINは4けた以上にしてください"); return; }
              ssSet("sw_pin", np);
              adminAction("setPin", { newPin: np }, "PINを変更しました");
              break;
            case "copyweek":
              var t0 = A.today;
              var p0 = t0.split("-");
              var lim = new Date(+p0[0], +p0[1] - 1, +p0[2] + 7);
              var limS = lim.getFullYear() + "-" + pad(lim.getMonth() + 1) + "-" + pad(lim.getDate());
              var wk = A.slots.filter(function (x) {
                return x.date >= t0 && x.date < limS && x.status === "booked";
              }).sort(function (a, b) {
                return a.date === b.date ? (a.start < b.start ? -1 : 1) : (a.date < b.date ? -1 : 1);
              });
              if (wk.length === 0) { toast("今後7日の予約はありません"); return; }
              var ls = ["【今週の授業予定】"];
              wk.forEach(function (x) {
                ls.push(fmtDateW(x.date) + " " + x.start + "〜" + endTime(x.start, x.min) + " " + x.studentName + "さん");
              });
              copyText(ls.join("\n"), "コピーしました。LINEに貼り付けできます");
              break;
          }
        });


        function copyText(text, okMsg) {
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(ta);
            toast(ok ? okMsg : "コピーできませんでした");
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
          } else fallback();
        }

        /* ---------- 起動 ---------- */
        try {
          var qk = new URLSearchParams(location.search).get("k");
          if (qk) {
            lsSet("sw_k", qk);
            history.replaceState(null, "", location.pathname);
          }
        } catch (e) {}
        if (API.indexOf("http") !== 0) {
          app.innerHTML = '<div class="loading">予約システムは準備中です。<br>もうしばらくお待ちください。</div>';
        } else {
          loadState().catch(function (e) {
            app.innerHTML = '<div class="loading">読み込みに失敗しました。<br>電波の良いところで再読み込みしてください。</div>';
          });
        }
      })();
    </script>
  </body>
</html>
