<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>授業の予定 | ステップワイズ英数教室・個別指導部</title>
    <meta
      name="description"
      content="ステップワイズ個別指導の授業予定ページです。先生からの案内を承認して授業の予定を確定できます。"
    />
    <style>
      :root {
        --ink: #19212a;
        --muted: #64717f;
        --line: #dbe3ea;
        --paper: #fbfcfd;
        --soft: #eef4fb;
        --primary: #0717a8;
        --primary-dark: #07106f;
        --coral: #d86f8d;
        --coral-soft: #fbeef2;
        --danger: #c0392b;
        --taken: #eef1f4;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(31, 48, 64, 0.1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.7;
        padding-bottom: 120px;
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px clamp(16px, 4vw, 40px);
        background: rgba(251, 252, 253, 0.92);
        border-bottom: 1px solid var(--line);
      }
      .brand { font-weight: 700; line-height: 1.25; font-size: 15px; }
      .brand small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
      .site-header a { color: var(--muted); font-size: 13px; text-decoration: none; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
      h1 { font-size: 21px; margin: 22px 0 2px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      h2 {
        font-size: 15px; font-weight: 700; margin: 26px 0 10px;
        display: flex; align-items: center; gap: 8px;
      }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      .card {
        background: var(--white); border: 1px solid var(--line);
        border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
      }
      select, input[type="text"], input[type="password"], input[type="date"], input[type="time"] {
        font: inherit; color: var(--ink); background: var(--white);
        border: 1px solid var(--line); border-radius: 10px;
        padding: 8px 10px; max-width: 100%;
      }
      select:focus, input:focus, button:focus-visible {
        outline: 2px solid var(--primary); outline-offset: 1px;
      }
      button {
        font: inherit; cursor: pointer; border: none; border-radius: 10px;
        padding: 9px 14px; font-weight: 600;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .btn-primary { background: var(--primary); color: var(--white); }
      .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
      .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      /* カレンダー */
      .cal { padding: 12px 12px 10px; }
      .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .callabel { font-weight: 700; font-size: 15px; }
      .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
      .calwd { font-size: 11px; color: var(--muted); padding: 2px 0; }
      .calwd.sun { color: var(--danger); }
      .calwd.sat { color: var(--primary); }
      .calday {
        position: relative; display: flex; flex-direction: column; align-items: center;
        justify-content: flex-start; gap: 1px; padding: 4px 0 3px; min-height: 42px;
        border-radius: 9px; border: 1px solid transparent; background: transparent;
        font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink);
      }
      button.calday { cursor: pointer; font-size: 13px; }
      .calday.sun { color: var(--danger); }
      .calday.sat { color: var(--primary); }
      .calday.off { opacity: 0.35; }
      .calday.today { border-color: var(--muted); }
      .calday.mine:not(.sel) { background: var(--coral-soft); }
      .calday.sel { background: var(--primary); color: var(--white); border-color: var(--primary); }
      .caldot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
      .caldot.op { background: var(--primary); }
      .caldot.tk { background: var(--muted); }
      .calday.sel .caldot { background: var(--white); }
      .calmark { font-size: 10px; line-height: 1; color: var(--coral); font-weight: 700; }
      .calday.sel .calmark { color: var(--white); }
      .calmarks { display: flex; align-items: center; gap: 2px; min-height: 7px; }
      .callegend {
        display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px;
        font-size: 11.5px; color: var(--muted);
      }
      .callegend span { display: inline-flex; align-items: center; gap: 4px; }
      /* 枠チップ */
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        font-variant-numeric: tabular-nums;
        border-radius: 10px; padding: 8px 12px; font-size: 14px;
        border: 1px solid var(--line); background: var(--white);
        display: inline-flex; align-items: center; gap: 6px;
      }
      button.chip { cursor: pointer; font-weight: 600; }
      .chip.open { border-color: var(--primary); color: var(--primary); }
      .chip.mine { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); font-weight: 700; }
      .chip.taken { background: var(--taken); color: var(--muted); }
      .chip.offer { background: #fdf3e3; border-color: #d99a2b; color: #a8721c; font-weight: 700; }
      .caldot.of { background: #d99a2b; }
      .calday.sel .caldot.of { background: var(--white); }
      .tag.offer { background: #fdf3e3; color: #a8721c; }
      .chip.sel { background: var(--primary); color: var(--white); border-color: var(--primary); }
      .empty { color: var(--muted); font-size: 13.5px; padding: 8px 2px; }
      .slotline {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
      }
      .slotline:last-child { border-bottom: none; }
      .slotline .time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 104px; }
      .slotline .who { flex: 1; min-width: 80px; }
      .slotline .who .name { font-weight: 700; }
      .tag { font-size: 11.5px; border-radius: 6px; padding: 1px 7px; font-weight: 700; }
      .tag.open { background: var(--soft); color: var(--primary); }
      .tag.done { background: var(--taken); color: var(--muted); }
      .tag.booked { background: var(--coral-soft); color: var(--coral); }
      .daygroup { margin-bottom: 14px; }
      .daylabel { font-weight: 700; font-size: 14px; margin: 0 0 6px 2px; }
      .daylabel .wd { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .daylabel .wd.sat { color: var(--primary); }
      .daylabel .wd.sun { color: var(--danger); }
      .formgrid { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
      .formgrid label { font-size: 13px; color: var(--muted); }
      .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
      .loglist { font-size: 13px; color: var(--muted); }
      .loglist div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
      .loglist div:last-child { border-bottom: none; }
      table.rec { border-collapse: collapse; width: 100%; font-size: 13.5px; }
      table.rec th, table.rec td {
        text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line);
        font-variant-numeric: tabular-nums;
      }
      table.rec th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
      .studentline { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .studentline:last-child { border-bottom: none; }
      .studentline .nm { flex: 1; font-weight: 600; }
      .confirmbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        background: var(--white); border-top: 1px solid var(--line);
        box-shadow: 0 -4px 16px rgba(31, 48, 64, 0.12);
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      }
      .confirmbar .inner { max-width: 640px; margin: 0 auto; }
      .confirmbar .msg { font-weight: 700; margin-bottom: 10px; }
      #toast {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: 24px; z-index: 30;
        background: var(--ink); color: var(--paper);
        border-radius: 99px; padding: 9px 18px; font-size: 13.5px;
        opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 88vw;
      }
      @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
      #toast.show { opacity: 1; }
      .loading { text-align: center; color: var(--muted); padding: 60px 0; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 12px;
        border: 3px solid var(--line); border-top-color: var(--primary);
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      footer.app {
        margin-top: 44px; padding: 16px 0 24px;
        display: flex; justify-content: space-between; align-items: center;
        color: var(--muted); font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="brand">ステップワイズ個別指導<small>英数教室・個別指導部</small></span>
      <a href="../">トップページへ</a>
    </header>
    <div class="wrap" id="app">
      <div class="loading"><div class="spinner"></div>読み込んでいます…</div>
    </div>
    <div id="toast" role="status"></div>

    <script>
      (function () {
        "use strict";
        /* デプロイしたApps ScriptウェブアプリのURL(/exec)をここに設定 */
        var API = "https://script.google.com/macros/s/AKfycbz53sl4GgKNY1UY1gaBndjDplQk5MrA9EfShYfy05Jl4JNEFEl7-B1uKSmd0v5Mhn4Irw/exec";

        var app = document.getElementById("app");
        var WD = ["日", "月", "火", "水", "木", "金", "土"];
        var S = null;          // 生徒向け状態 {students, slots, today}
        var A = null;          // 先生向け状態
        var pending = null;    // {kind, slotId}
        var busy = false;
        var calNow = new Date();
        var calY = calNow.getFullYear(), calM = calNow.getMonth();
        var selDate = null, selManual = false;

        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
        function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
        function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
        function sameId(a, b) { return String(a) === String(b); }
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function pad(n) { return String(n).length < 2 ? "0" + n : String(n); }
        function wdOf(ds) { var p = ds.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
        function fmtDate(ds) { var p = ds.split("-"); return (+p[1]) + "/" + (+p[2]); }
        function fmtDateW(ds) { return fmtDate(ds) + "(" + WD[wdOf(ds)] + ")"; }
        function endTime(start, min) {
          var p = start.split(":");
          var t = (+p[0]) * 60 + (+p[1]) + (+min);
          return pad(Math.floor(t / 60) % 24) + ":" + pad(t % 60);
        }
        function gcalUrl(s) {
          var d = s.date.replace(/-/g, "");
          var st = s.start.replace(":", "");
          var en = endTime(s.start, s.min).replace(":", "");
          var u = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
            "&text=" + encodeURIComponent("塾の授業" + (s.subject ? "(" + s.subject + ")" : "(ステップワイズ)")) +
            "&dates=" + d + "T" + st + "00/" + d + "T" + en + "00&ctz=Asia/Tokyo";
          if (s.meet) u += "&details=" + encodeURIComponent("Meetで参加: " + s.meet);
          return u;
        }
        function addDaysStr(ds, n) {
          var p = ds.split("-");
          var d = new Date(+p[0], +p[1] - 1, +p[2] + n);
          return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        }
        // 連続する日付(同じメモ)を1つのグループにまとめる
        function groupBlocked(list) {
          var sorted = list.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
          var groups = [], cur = null;
          sorted.forEach(function (b) {
            if (cur && String(b.note || "") === cur.note && b.date === addDaysStr(cur.end, 1)) {
              cur.end = b.date;
              cur.ids.push(b.id);
            } else {
              cur = { start: b.date, end: b.date, note: String(b.note || ""), ids: [b.id] };
              groups.push(cur);
            }
          });
          return groups;
        }
        function rangeLabel(g) {
          return g.start === g.end ? fmtDateW(g.start) : fmtDateW(g.start) + "〜" + fmtDateW(g.end);
        }
        var toastTimer = null;
        function toast(msg) {
          var t = document.getElementById("toast");
          t.textContent = msg; t.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800);
        }

        /* ---------- API ---------- */
        function apiGet(params) {
          var q = Object.keys(params).map(function (k) {
            return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
          }).join("&");
          return fetch(API + "?" + q).then(function (r) { return r.json(); });
        }
        function apiPost(body) {
          return fetch(API, { method: "POST", body: JSON.stringify(body) })
            .then(function (r) { return r.json(); });
        }

        var previewK = null; // 先生が生徒画面をプレビュー中の生徒コード
        function myKey() { return previewK || lsGet("sw_k") || ""; }

        function loadState() {
          return apiGet({ action: "state", k: myKey() }).then(function (res) {
            if (res.error) throw new Error(res.error);
            S = res;
            render();
          });
        }

        /* ---------- カレンダー ---------- */
        function renderCal(info, today, kind) {
          var label = calY + "年" + (calM + 1) + "月";
          var minIdx = calNow.getFullYear() * 12 + calNow.getMonth();
          var curIdx = calY * 12 + calM;
          var maxIdx = minIdx + 3;
          var h = '<div class="card cal"><div class="calhead">';
          h += '<button class="btn-quiet btn-sm" data-action="calprev"' + (curIdx <= minIdx ? " disabled" : "") + ' aria-label="前の月">◀</button>';
          h += '<span class="callabel">' + label + "</span>";
          h += '<button class="btn-quiet btn-sm" data-action="calnext"' + (curIdx >= maxIdx ? " disabled" : "") + ' aria-label="次の月">▶</button>';
          h += '</div><div class="calgrid">';
          WD.forEach(function (w, i) {
            h += '<span class="calwd' + (i === 0 ? " sun" : i === 6 ? " sat" : "") + '">' + w + "</span>";
          });
          var startWd = new Date(calY, calM, 1).getDay();
          for (var i = 0; i < startWd; i++) h += "<span></span>";
          var days = new Date(calY, calM + 1, 0).getDate();
          for (var d = 1; d <= days; d++) {
            var ds = calY + "-" + pad(calM + 1) + "-" + pad(d);
            var it = info[ds];
            var wd = (startWd + d - 1) % 7;
            var cls = "calday";
            if (wd === 0) cls += " sun";
            if (wd === 6) cls += " sat";
            if (ds === today) cls += " today";
            if (ds === selDate) cls += " sel";
            var past = ds < today;
            var marks = '<span class="calmarks">';
            if (it && !past) {
              if (kind === "teacher") {
                if (it.booked) marks += '<span class="caldot op"></span>';
                if (it.offered) marks += '<span class="caldot of"></span>';
              } else {
                if (it.mine) { marks += '<span class="calmark">✓</span>'; cls += " mine"; }
                if (it.offer) marks += '<span class="caldot of"></span>';
              }
              if (it.ng) marks += '<span class="calmark" style="color:var(--muted)">×</span>';
            }
            marks += "</span>";
            var clickable = !past && (it || kind === "teacher");
            if (!clickable) {
              h += '<span class="' + cls + ' off">' + d + marks + "</span>";
            } else {
              h += '<button class="' + cls + '" data-action="calday" data-date="' + ds + '">' + d + marks + "</button>";
            }
          }
          h += '</div><div class="callegend">';
          if (kind === "teacher") {
            h += '<span><span class="caldot op"></span> 確定した授業</span>';
            h += '<span><span class="caldot of"></span> 承認待ちの案内</span>';
            h += '<span><span class="calmark" style="color:var(--muted)">×</span> 都合が悪い生徒あり</span>';
          } else {
            h += '<span><span class="caldot of"></span> 先生からの案内</span>';
            h += '<span><span class="calmark">✓</span> あなたの授業</span>';
            h += '<span><span class="calmark" style="color:var(--muted)">×</span> 都合が悪い日</span>';
          }
          h += "</div></div>";
          return h;
        }

        /* ---------- 生徒画面 ---------- */
        function renderGuard() {
          var html = "";
          html += '<div class="card" style="margin-top:26px;text-align:center;padding:28px 20px">';
          html += '<div style="font-weight:700;font-size:16px;margin-bottom:8px">専用リンクからひらいてください</div>';
          html += '<div style="font-size:13.5px;color:var(--muted)">このページは、先生からLINEで送られた<br>あなた専用のリンクからひらく必要があります。<br>リンクが分からないときは、LINEで先生に連絡してください。</div>';
          html += "</div>";
          html += '<footer class="app"><span></span><span></span></footer>';
          app.innerHTML = html;
        }

        function renderStudent() {
          if (!S || !S.me) { renderGuard(); return; }
          var today = S.today;
          var slots = S.slots.slice().sort(function (a, b) {
            return a.date === b.date ? (a.start < b.start ? -1 : 1) : (a.date < b.date ? -1 : 1);
          });

          var html = "";
          if (previewK) {
            html += '<div style="background:#fdf3e3;border:1px solid #d99a2b;color:#a8721c;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="flex:1"><strong>' + esc(S.me ? S.me.name : "") + 'さんのページを表示中</strong>(ここでの操作は本人として反映されます)</span><button class="btn-quiet btn-sm" data-action="exitpreview">先生モードへ戻る</button></div>';
          }
          html += '<h1>授業の予定</h1><p class="sub">' + esc(S.me.name) + 'さんの予定ページです</p>';

          // 今月の授業(教科ごとの回数)
          (function () {
            var ym = today.slice(0, 7);
            var doneM = (S.history || []).filter(function (h) { return h.date.slice(0, 7) === ym; });
            var planM = slots.filter(function (s) { return s.st === "mine" && s.date.slice(0, 7) === ym; });
            var bySub = {}, order = [];
            doneM.concat(planM).forEach(function (x) { var k = x.subject || "その他"; if (!bySub[k]) { bySub[k] = { done: 0, plan: 0 }; order.push(k); } });
            doneM.forEach(function (x) { bySub[x.subject || "その他"].done++; });
            planM.forEach(function (x) { bySub[x.subject || "その他"].plan++; });
            if (order.length === 0) return;
            html += '<div class="card" style="margin-top:12px;padding:10px 14px"><div style="font-size:12.5px;color:var(--muted);margin-bottom:4px">' + (+ym.slice(5)) + '月の授業</div><div class="row" style="gap:8px 18px">';
            order.forEach(function (k) {
              var b = bySub[k];
              html += '<span><strong>' + esc(k) + '</strong> <span style="font-variant-numeric:tabular-nums">' + (b.done + b.plan) + '回</span>' +
                '<span style="font-size:12px;color:var(--muted)">(実施 ' + b.done + '・予定 ' + b.plan + ')</span></span>';
            });
            html += '</div></div>';
          })();

          var offers = slots.filter(function (s) { return s.st === "offer"; });
          if (offers.length > 0) {
            html += "<h2>先生からの案内</h2>";
            html += '<div class="card">';
            offers.forEach(function (s) {
              html += '<div class="slotline"><span class="time">' + fmtDateW(s.date) + " " + s.start + "〜" + endTime(s.start, s.min) + "</span>";
              html += '<span class="who">' + (s.subject ? esc(s.subject) : "") + "</span>";
              html += '<button class="btn-primary btn-sm" data-action="askaccept" data-id="' + esc(s.id) + '">承認する</button>';
              html += '<button class="btn-quiet btn-sm" data-action="askdecline" data-id="' + esc(s.id) + '">都合が悪い</button>';
              html += "</div>";
            });
            html += '</div><div class="note">承認すると授業が確定し、カレンダー登録とMeetリンクの発行が行われます。</div>';
          }

          var mine = slots.filter(function (s) { return s.st === "mine"; });
          html += "<h2>あなたの予定</h2>";
          if (mine.length === 0) {
            html += '<div class="empty">予定はまだありません。先生から案内が届くとここに表示されます。</div>';
          } else {
            html += '<div class="card">';

        /* ---------- 先生画面 ---------- */

          html += '<footer class="app"><span></span><span></span></footer>';

          if (pending && pending.kind === "ngconfirm" && offerDraft) {
            html += '<div class="confirmbar"><div class="inner">';
            html += '<div class="msg">' + esc(offerDraft.msg || "") + "</div>";
            html += '<div class="row"><button class="btn-primary" data-action="doforce"' + (busy ? " disabled" : "") + '>それでも案内する</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
            html += "</div></div>";
          }
          if (pending && (pending.kind === "tdel" || pending.kind === "tcancel")) {
            var s3 = null;
            slots.forEach(function (x) { if (sameId(x.id, pending.slotId)) s3 = x; });
            if (s3) {
              var when3 = fmtDateW(s3.date) + " " + s3.start + "〜" + endTime(s3.start, s3.min);
              html += '<div class="confirmbar"><div class="inner">';
              if (pending.kind === "tdel") {
                html += '<div class="msg">' + when3 + " の枠を削除しますか?</div>";
                html += '<div class="row"><button class="btn-danger" data-action="dotdel"' + (busy ? " disabled" : "") + '>削除する</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
              } else {
                html += '<div class="msg">' + esc(s3.studentName) + "さんの " + when3 + " の予約を解除しますか?</div>";
                html += '<div class="row"><button class="btn-danger" data-action="dotcancel"' + (busy ? " disabled" : "") + '>解除する</button><button class="btn-quiet" data-action="closebar">やめる</button></div>';
              }
              html += "</div></div>";
            }
          }
          app.innerHTML = html;
        }

        var authM = null; // 'pin'(未設定=初期設定画面) | 'account'(ログイン画面)
        function admToken() { return lsGet("sw_admt") || ""; }

        function renderAuth() {
          var html = "";
          html += '<h1 style="margin-top:22px">先生モード</h1>';
          if (authM === null) {
            html += '<div class="loading"><div class="spinner"></div>確認しています…</div>';
          } else if (authM === "pin") {
            html += '<p class="sub">はじめに先生アカウントを作成します(次回からメールとパスワードでログイン)</p>';
            html += '<div class="card" style="margin-top:14px"><div class="formgrid">';
            html += '<label for="a-pin">現在のPIN</label><input type="password" id="a-pin" inputmode="numeric" maxlength="8" autocomplete="off" style="width:110px">';
            html += '<label for="a-email">メールアドレス</label><input type="email" id="a-email" autocomplete="username" placeholder="you@example.com">';
            html += '<label for="a-pass">パスワード</label><input type="password" id="a-pass" autocomplete="new-password" placeholder="8文字以上">';
            html += '<label for="a-pass2">もう一度</label><input type="password" id="a-pass2" autocomplete="new-password">';
            html += '</div><div class="row" style="margin-top:12px">';
            html += '<button class="btn-primary" data-action="dosetup"' + (busy ? " disabled" : "") + ">" + (busy ? "作成しています…" : "アカウントを作成") + "</button>";
            html += '<button class="btn-quiet btn-sm" data-action="exitteacher">もどる</button>';
            html += '</div><div class="note">パスワードを忘れた場合は、スプレッドシート「ステップワイズ予約システム」のconfigシートで passHash / passSalt / teacherEmail の行を削除すると、この初期設定からやり直せます。</div></div>';
          } else {
            html += '<div class="card" style="margin-top:14px"><div class="formgrid">';
            html += '<label for="a-email">メールアドレス</label><input type="email" id="a-email" autocomplete="username">';
            html += '<label for="a-pass">パスワード</label><input type="password" id="a-pass" autocomplete="current-password">';
            html += '</div><div class="row" style="margin-top:12px">';
            html += '<button class="btn-primary" data-action="dologin"' + (busy ? " disabled" : "") + ">" + (busy ? "ログインしています…" : "ログイン") + "</button>";
            html += '<button class="btn-quiet btn-sm" data-action="exitteacher">もどる</button>';
            html += "</div></div>";
          }
          app.innerHTML = html;
          var el = document.getElementById("a-email");
          if (el) el.focus();
        }

        function mode() { return ssGet("sw_mode") || "student"; }
        function render() {
          // 先生モードは管理画面(/kanri/)へ移動したため、このページは常に生徒画面
          renderStudent();
        }

        function afterAuth(res) {
          if (res.token) lsSet("sw_admt", res.token);
          A = res.admin;
          ssSet("sw_mode", "teacher");
          selDate = null; selManual = false;
          render();
        }

        /* ---------- 通信つきアクション ---------- */
        function studentAction(body, okMsg) {
          if (busy) return;
          busy = true; render();
          apiPost(body).then(function (res) {
            busy = false; pending = null;
            if (res.error) {
              toast(res.error);
              if (res.badCode) { S = { me: null, slots: [], today: "" }; render(); return; }
              if (res.refresh) return loadState();
              render();
              return;
            }
            S = res.state;
            render();
            if (okMsg) toast(okMsg);
          }).catch(function () {
            busy = false;
            toast("通信に失敗しました。電波の良いところでもう一度お試しください");
            render();
          });
        }

        var offerDraft = null;
        function sendOffer(force) {
          if (!offerDraft || busy) return;
          busy = true; render();
          var body = { action: "admin", token: admToken(), op: "offer", force: !!force };
          ["studentId", "date", "start", "min", "repeat", "subject"].forEach(function (k2) { body[k2] = offerDraft[k2]; });
          apiPost(body).then(function (res) {
            busy = false;
            if (res.error) {
              if (res.needForce) {
                offerDraft.msg = res.error;
                pending = { kind: "ngconfirm" };
                render();
                return;
              }
              toast(res.error);
              if (res.badAuth) {
                try { localStorage.removeItem("sw_admt"); } catch (e) {}
                A = null; authM = "account"; ssSet("sw_mode", "auth");
              }
              pending = null; render();
              return;
            }
            pending = null; offerDraft = null;
            if (res.admin) A = res.admin;
            render();
            toast("案内を送りました");
          }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });
        }

        function adminAction(op, extra, okMsg) {
          if (busy) return;
          busy = true; render();
          var body = { action: "admin", token: admToken(), op: op };
          Object.keys(extra || {}).forEach(function (k) { body[k] = extra[k]; });
          apiPost(body).then(function (res) {
            busy = false; pending = null;
            if (res.error) {
              toast(res.error);
              if (res.badAuth) {
                try { localStorage.removeItem("sw_admt"); } catch (e) {}
                A = null; authM = "account"; ssSet("sw_mode", "auth");
              }
              render();
              return;
            }
            if (res.token) lsSet("sw_admt", res.token);
            if (res.admin) A = res.admin;
            render();
            if (okMsg) toast(okMsg);
          }).catch(function () {
            busy = false;
            toast("通信に失敗しました。もう一度お試しください");
            render();
          });
        }

        // 先生モードへ入る(?teacher=1 からの自動遷移と、セッションに先生モードが残っていた場合の復帰に共用)
        function enterTeacher() {
              previewK = null;
              ssSet("sw_mode", "auth"); authM = null; render();
              apiGet({ action: "authmode", t: Date.now() }).then(function (res) {
                authM = res.mode === "account" ? "account" : "pin";
                if (authM === "account" && admToken()) {
                  // 保存済みトークンで自動ログインを試す
                  busy = true; render();
                  apiPost({ action: "admin", token: admToken(), op: "state" }).then(function (r2) {
                    busy = false;
                    if (r2.ok) { afterAuth(r2); return; }
                    try { localStorage.removeItem("sw_admt"); } catch (e) {}
                    render();
                  }).catch(function () { busy = false; render(); });
                } else {
                  render();
                }
              }).catch(function () { authM = "account"; render(); });
        }

        /* ---------- イベント ---------- */
        app.addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-action]");
          if (!btn || btn.disabled) return;
          var act = btn.getAttribute("data-action");
          var id = btn.getAttribute("data-id");

          switch (act) {
            case "teacher": enterTeacher(); break;
            case "exitteacher":
              ssSet("sw_mode", "student"); pending = null;
              selDate = null; selManual = false;
              busy = true; render();
              loadState().catch(function () { toast("通信に失敗しました"); })
                .then(function () { busy = false; render(); });
              break;
            case "dosetup":
              var spin = (document.getElementById("a-pin") || {}).value || "";
              var sem = ((document.getElementById("a-email") || {}).value || "").trim();
              var sp1 = (document.getElementById("a-pass") || {}).value || "";
              var sp2 = (document.getElementById("a-pass2") || {}).value || "";
              if (sp1.length < 8) { toast("パスワードは8文字以上にしてください"); return; }
              if (sp1 !== sp2) { toast("パスワードが一致しません"); return; }
              busy = true; render();
              apiPost({ action: "admin", op: "setupAccount", pin: spin, email: sem, password: sp1 }).then(function (res) {
                busy = false;
                if (res.error) { toast(res.error); render(); return; }
                afterAuth(res);
                toast("アカウントを作成しました");
              }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });
              break;
            case "dologin":
              var lem = ((document.getElementById("a-email") || {}).value || "").trim();
              var lpw = (document.getElementById("a-pass") || {}).value || "";
              busy = true; render();
              apiPost({ action: "admin", op: "login", email: lem, password: lpw }).then(function (res) {
                busy = false;
                if (res.error) { toast(res.error); render(); return; }
                afterAuth(res);
              }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });
              break;
            case "closebar":
              pending = null; render(); break;
            case "calprev":
              calM--; if (calM < 0) { calM = 11; calY--; }
              pending = null; render(); break;
            case "calnext":
              calM++; if (calM > 11) { calM = 0; calY++; }
              pending = null; render(); break;
            case "calday":
              selDate = btn.getAttribute("data-date");
              selManual = true; pending = null; render(); break;

            case "askaccept":
              pending = { kind: "accept", slotId: id }; render(); break;
            case "doaccept":
              studentAction({ action: "accept", slotId: pending.slotId, k: myKey() }, "授業が確定しました ✓");
              break;
            case "askdecline":
              pending = { kind: "decline", slotId: id }; render(); break;
            case "dodecline":
              studentAction({ action: "decline", slotId: pending.slotId, k: myKey() }, "先生に伝えました");
              break;
            case "askcancel":
              pending = { kind: "cancel", slotId: id }; render(); break;
            case "docancel":
              studentAction({ action: "cancelReq", slotId: pending.slotId, k: myKey(), reason: ((document.getElementById("f-creason") || {}).value || "").trim() }, "先生に取消を依頼しました");
              break;
            case "askwithdraw":
              pending = { kind: "withdraw", slotId: id }; render(); break;
            case "dowithdraw":
              studentAction({ action: "cancelReq", withdraw: true, slotId: pending.slotId, k: myKey() }, "依頼を取り下げました");
              break;

            case "offerslot":
              var stid = (document.getElementById("f-student") || {}).value;
              var date = (document.getElementById("f-date") || {}).value;
              var start = (document.getElementById("f-start") || {}).value;
              var min = +((document.getElementById("f-min") || {}).value || 60);
              var rep = +((document.getElementById("f-rep") || {}).value || 1);
              if (!stid) { toast("生徒をえらんでください"); return; }
              if (!date || !start) { toast("日付と時間を入れてください"); return; }
              var subj = (document.getElementById("f-subject") || {}).value || "";
              offerDraft = { studentId: stid, date: date, start: start, min: min, repeat: rep, subject: subj };
              sendOffer(false);
              break;
            case "doforce":
              sendOffer(true); break;
            case "taddblock":
              var bs = (document.getElementById("b-student") || {}).value;
              var bd2 = (document.getElementById("b-date") || {}).value;
              var bd2to = (document.getElementById("b-date2") || {}).value;
              var bn2 = ((document.getElementById("b-note") || {}).value || "").trim();
              if (!bs) { toast("生徒をえらんでください"); return; }
              if (!bd2) { toast("日付をえらんでください"); return; }
              adminAction("addBlock", { studentId: bs, date: bd2, dateTo: bd2to || bd2, note: bn2 }, "登録しました");
              break;
            case "tdelblock":
              var tids = btn.getAttribute("data-ids");
              adminAction("delBlock", tids ? { blockIds: tids.split(",") } : { blockId: id }, "削除しました");
              break;
            case "addwish":
              var wd = (document.getElementById("f-wdate") || {}).value;
              var ws = (document.getElementById("f-wstart") || {}).value;
              var we = (document.getElementById("f-wend") || {}).value;
              var wn = ((document.getElementById("f-wnote") || {}).value || "").trim();
              if (!wd) { toast("日付をえらんでください"); return; }
              if (!ws || !we || ws >= we) { toast("時間帯は「開始 < 終了」で入れてください"); return; }
              studentAction({ action: "wish", k: myKey(), date: wd, start: ws, end: we, note: wn }, "希望を先生に送りました");
              break;
            case "delwish":
              studentAction({ action: "unwish", k: myKey(), wishId: id }, "希望を取り消しました");
              break;
            case "addblock":
              var bd = (document.getElementById("f-bdate") || {}).value;
              var bdto = (document.getElementById("f-bdate2") || {}).value;
              var bn = ((document.getElementById("f-bnote") || {}).value || "").trim();
              if (!bd) { toast("日付をえらんでください"); return; }
              studentAction({ action: "block", k: myKey(), date: bd, dateTo: bdto || bd, note: bn }, "登録しました");
              break;
            case "delblock":
              var sids = btn.getAttribute("data-ids");
              studentAction({ action: "unblock", k: myKey(), blockIds: sids ? sids.split(",") : [id] }, "取り消しました");
              break;
            case "delslot":
              pending = { kind: "tdel", slotId: id }; render(); break;
            case "dotdel":
              adminAction("deleteSlot", { slotId: pending.slotId }, "枠を削除しました");
              break;
            case "unbook":
              pending = { kind: "tcancel", slotId: id }; render(); break;
            case "dotcancel":
              adminAction("unbook", { slotId: pending.slotId }, "予約を解除しました");
              break;
            case "toggledone":
              adminAction("toggleDone", { slotId: id });
              break;
            case "copybill":
              var mk2 = btn.getAttribute("data-month");
              var sid3 = id;
              var stu = null;
              A.students.forEach(function (x) { if (sameId(x.id, sid3)) stu = x; });
              if (!stu) { toast("生徒が見つかりません"); return; }
              var lessons = A.slots.filter(function (x) {
                return sameId(x.studentId, sid3) && x.status === "booked" && x.done && x.date.slice(0, 7) === mk2;
              }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
              if (lessons.length === 0) { toast("実施済みの授業がありません"); return; }
              var totalMin = 0;
              var lines2 = ["【" + (+mk2.slice(5, 7)) + "月分 授業料のご案内】" + stu.name + "さん", ""];
              lessons.forEach(function (x) {
                totalMin += Number(x.min) || 0;
                lines2.push("・" + fmtDateW(x.date) + " " + x.start + "〜" + endTime(x.start, x.min) + "(" + x.min + "分" + (x.subject ? "・" + x.subject : "") + ")");
              });
              lines2.push("");
              if (stu.monthly > 0) {
                lines2.push("月謝: " + stu.monthly.toLocaleString() + "円(実施 " + lessons.length + "回)");
              } else {
                lines2.push("合計: " + lessons.length + "回・" + totalMin + "分 = " + Math.round(totalMin / 30 * (stu.rate30 || 0)).toLocaleString() + "円");
              }
              copyText(lines2.join("\n"), "請求文面をコピーしました。LINEに貼り付けできます");
              break;
            case "viewstudent":
              var st6 = null;
              A.students.forEach(function (x) { if (sameId(x.id, id)) st6 = x; });
              if (!st6 || !st6.code) { toast("リンクがまだ発行されていません"); return; }
              previewK = st6.code;
              ssSet("sw_mode", "student");
              pending = null; selDate = null; selManual = false;
              busy = true; render();
              loadState().catch(function () { toast("通信に失敗しました"); })
                .then(function () { busy = false; render(); });
              break;
            case "exitpreview":
              previewK = null;
              ssSet("sw_mode", "teacher");
              pending = null; selDate = null; selManual = false;
              busy = true; render();
              apiPost({ action: "admin", token: admToken(), op: "state" }).then(function (res) {
                busy = false;
                if (res.ok) { A = res.admin; render(); return; }
                A = null; authM = "account"; ssSet("sw_mode", "auth"); render();
              }).catch(function () { busy = false; toast("通信に失敗しました"); render(); });
              break;
            case "changepass":
              var cpw = (document.getElementById("f-curpass") || {}).value || "";
              var npw = (document.getElementById("f-newpass") || {}).value || "";
              if (npw.length < 8) { toast("新しいパスワードは8文字以上にしてください"); return; }
              adminAction("changePass", { current: cpw, newPass: npw }, "パスワードを変更しました");
              break;
            case "logout":
              apiPost({ action: "admin", token: admToken(), op: "logout" }).catch(function () {});
              try { localStorage.removeItem("sw_admt"); } catch (e) {}
              A = null; authM = "account";
              ssSet("sw_mode", "student");
              pending = null; selDate = null; selManual = false;
              busy = true; render();
              loadState().catch(function () {}).then(function () { busy = false; render(); });
              toast("ログアウトしました");
              break;
            case "copyweek":
              var t0 = A.today;
              var p0 = t0.split("-");
              var lim = new Date(+p0[0], +p0[1] - 1, +p0[2] + 7);
              var limS = lim.getFullYear() + "-" + pad(lim.getMonth() + 1) + "-" + pad(lim.getDate());
              var wk = A.slots.filter(function (x) {
                return x.date >= t0 && x.date < limS && x.status === "booked";
              }).sort(function (a, b) {
                return a.date === b.date ? (a.start < b.start ? -1 : 1) : (a.date < b.date ? -1 : 1);
              });
              if (wk.length === 0) { toast("今後7日の予約はありません"); return; }
              var ls = ["【今週の授業予定】"];
              wk.forEach(function (x) {
                ls.push(fmtDateW(x.date) + " " + x.start + "〜" + endTime(x.start, x.min) + " " + x.studentName + "さん");
              });
              copyText(ls.join("\n"), "コピーしました。LINEに貼り付けできます");
              break;
          }
        });


        // 案内フォームで生徒を選ぶと、その生徒の前回の科目を自動セット
        app.addEventListener("change", function (ev) {
          if (!ev.target || ev.target.id !== "f-student") return;
          var sel = document.getElementById("f-subject");
          if (!sel || !A) return;
          var sid5 = ev.target.value;
          var latest = "", latestDate = "";
          (A.slots || []).forEach(function (s) {
            if (sameId(s.studentId, sid5) && s.subject && s.date >= latestDate) {
              latestDate = s.date; latest = s.subject;
            }
          });
          sel.value = latest || "";
        });

        function copyText(text, okMsg) {
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(ta);
            toast(ok ? okMsg : "コピーできませんでした");
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
          } else fallback();
        }

        /* ---------- 起動 ---------- */
        try {
          var qs = new URLSearchParams(location.search);
          var qk = qs.get("k");
          var qp = qs.get("preview"); // 管理画面から「生徒画面を見る」(先生ログイン時のみ・本人キーは保存しない)
          if (qs.get("teacher")) history.replaceState(null, "", location.pathname); // 旧リンク互換(先生機能は管理画面へ移動済み)
          if (qk) {
            lsSet("sw_k", qk);
            history.replaceState(null, "", location.pathname);
          } else if (qp) {
            if (lsGet("sw_admt")) { previewK = qp; ssSet("sw_mode", "student"); }
            history.replaceState(null, "", location.pathname);
          }
        } catch (e) {}
        if (API.indexOf("http") !== 0) {
          app.innerHTML = '<div class="loading">予約システムは準備中です。<br>もうしばらくお待ちください。</div>';
        } else {
          loadState().then(function () {
            // 先生機能は管理画面(/kanri/)に移動。このページは生徒専用
          }).catch(function (e) {
            app.innerHTML = '<div class="loading">読み込みに失敗しました。<br>電波の良いところで再読み込みしてください。</div>';
          });
        }
      })();
    </script>
  </body>
</html>
