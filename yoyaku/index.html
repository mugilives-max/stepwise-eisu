<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>授業の予約 | ステップワイズ英数教室・個別指導部</title>
    <meta
      name="description"
      content="ステップワイズ個別指導の授業予約ページです。空いている枠をえらんで予約できます。"
    />
    <style>
      :root {
        --ink: #19212a;
        --muted: #64717f;
        --line: #dbe3ea;
        --paper: #fbfcfd;
        --soft: #eef4fb;
        --primary: #0717a8;
        --primary-dark: #07106f;
        --white: #ffffff;
        --shadow: 0 18px 48px rgba(31, 48, 64, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        line-height: 1.75;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px clamp(18px, 4vw, 56px);
        background: rgba(251, 252, 253, 0.9);
        border-bottom: 1px solid rgba(219, 227, 234, 0.8);
      }
      .brand {
        font-weight: 700;
        line-height: 1.2;
      }
      .brand small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      .site-header a.back {
        color: var(--muted);
        font-size: 13px;
        text-decoration: none;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 18px 48px;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: clamp(28px, 5vw, 40px);
        text-align: center;
      }
      h1 {
        font-size: clamp(22px, 5vw, 26px);
        margin: 0 0 10px;
      }
      .lead {
        color: var(--muted);
        font-size: 14.5px;
        margin: 0 0 26px;
      }
      .cta {
        display: block;
        background: var(--primary);
        color: var(--white);
        text-decoration: none;
        font-weight: 700;
        font-size: 17px;
        padding: 16px 20px;
        border-radius: 12px;
        transition: background 0.2s;
      }
      .cta:hover {
        background: var(--primary-dark);
      }
      .steps {
        margin: 26px 0 0;
        padding: 18px 20px;
        background: var(--soft);
        border-radius: 12px;
        text-align: left;
        font-size: 13.5px;
      }
      .steps p {
        margin: 0 0 6px;
        font-weight: 700;
      }
      .steps ol {
        margin: 0;
        padding-left: 20px;
        color: var(--muted);
      }
      .note {
        margin-top: 18px;
        font-size: 12.5px;
        color: var(--muted);
      }
      footer {
        text-align: center;
        padding: 18px;
        color: var(--muted);
        font-size: 12px;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="brand">
        ステップワイズ個別指導
        <small>英数教室・個別指導部</small>
      </span>
      <a class="back" href="../">トップページへ</a>
    </header>
    <main>
      <div class="card">
        <h1>授業の予約</h1>
        <p class="lead">
          空いている枠をスマホからえらんで、そのまま予約できます。
        </p>
        <a
          class="cta"
          href="https://claude.ai/code/artifact/2e1915ec-709c-45bc-9645-a8bfcb73a82a"
          >予約ページをひらく</a
        >
        <div class="steps">
          <p>予約のながれ</p>
          <ol>
            <li>上のボタンから予約ページをひらく</li>
            <li>自分の名前をえらぶ</li>
            <li>カレンダーで空いている枠をタップして予約</li>
          </ol>
        </div>
        <p class="note">
          うまくひらけない場合は、LINEでそのままご連絡ください。
        </p>
      </div>
    </main>
    <footer>ステップワイズ英数教室・個別指導部</footer>
  </body>
</html>
